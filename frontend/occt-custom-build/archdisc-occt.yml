# ArchDisc custom OCCT WASM build configuration
# =============================================================================
# Builds a complete-API OCCT WebAssembly module ("full OCCT, local") for the
# ArchDisc B-rep kernel, replacing the prebuilt `opencascade.js` npm package.
#
# WHY A FULL BUILD:
#   The upstream `builds/opencascade.full.yml` (which produced the prebuilt
#   `opencascade.full.wasm` the app ships today) declares NO `bindings` list at
#   all — so `bindings` defaults to `[]`. In `buildFromYaml.py`,
#   `shouldProcessSymbol()` returns True for EVERY symbol when `len(bindings)==0`.
#   An empty `bindings` list is therefore literally "expose the complete OCCT
#   API" — exactly the roadmap goal of "full OCCT".
#
#   This config reproduces that full build and adds `additionalCppCode` to
#   close the one binding that cannot be expressed as a plain symbol entry:
#   a Handle wrapper for a freshly-constructed Geom_BSplineSurface.
#
# DETERMINISM / API COMPATIBILITY:
#   Build it inside the Docker image `donalffons/opencascade.js:2.0.0-beta.b5ff984`
#   — the image tag that EXACTLY matches the npm package pin
#   `opencascade.js@2.0.0-beta.b5ff984` in frontend/package.json. Same OCCT
#   commit (bb368e271e24f63078129283148ce83db6b9670a, OCCT 7.6.2) and same
#   Emscripten (emsdk 3.1.14). The custom WASM is therefore ABI/API-compatible
#   with all existing kernel/brep/ code — it is a strict superset of the
#   current `oc` API surface.
#
# WHAT THIS UNLOCKS (roadmap §3 parity gaps — see docs/superpowers/notes/
# parity-audit.md "Gap Closure List"):
#   - gp_Pnt2d 2-arg ctor (gp_Pnt2d_2)        -> P1 G2-Blend analytic face,
#                                                 P4 arbitrary face swap
#   - BOPAlgo_PaveFiller                      -> P7 single-solid self-intersect
#                                                 (unlocks BOPAlgo_CheckerSI)
#   - BVH_PrimitiveSet                        -> SelfIntersection.OverlapElements()
#   - ShapeConstruct_ProjectCurveOnSurface    -> P4 pcurve generation
#   - Handle_Geom_BSplineSurface ctor         -> direct NURBS TopoDS_Face
#   - BRepOffsetAPI_MakeFilling               -> G1 N-Sided Patch (see README risk)
#   With `bindings: []` ALL of the above are bound automatically; they are
#   listed here only as documentation of intent.
# =============================================================================

mainBuild:
  name: archdisc-occt.js

  # Empty bindings list == FULL OCCT API. `buildFromYaml.py shouldProcessSymbol`
  # returns True for every symbol when this list is empty. This is the same
  # selection the prebuilt `opencascade.full.wasm` was produced with.
  bindings: []

  # emccFlags — the FINAL LINK flags (buildFromYaml.py appends them verbatim to
  # the `emcc -lembind <14k objects> -o archdisc-occt.js` master-link command).
  #
  # MEMORY FIX (2026-05-21) — the first build attempt was OOM-killed:
  #   `emcc: error: 'wasm-ld @...rsp' failed (received SIGKILL (-9))`
  # SIGKILL/-9 on wasm-ld is the Linux OOM killer. The full-OCCT link is a
  # whole-program LTO codegen of ~14,300 LLVM-bitcode objects (5,387 OCCT
  # sources + 8,975 Embind bindings); with `-flto -O3` wasm-ld + wasm-opt hold
  # the entire program IR live and peak at 10-12 GB+ (emscripten#14485,
  # emscripten#15921). Docker Desktop's WSL 2 VM defaults to ~8 GB on this
  # 15.4 GB host, so the linker was killed. The `strtoll_l` "Diagnostic
  # Messages" in the log are unrelated, non-fatal libclang parse noise.
  #
  # Two-part fix:
  #   1. Raise the VM memory ceiling — see `.wslconfig` in this directory
  #      (memory=13GB). REQUIRED: `wsl --shutdown` then restart Docker Desktop
  #      so the new ceiling takes effect before launching the build.
  #   2. Cut linker peak memory via the flags below:
  #      - `-flto` REMOVED        : the dominant wasm-ld memory consumer. The
  #                                 input .o are still LTO bitcode (compiled by
  #                                 the image), so wasm-ld must still run LTO
  #                                 codegen — but dropping the program-level
  #                                 `-flto` request avoids the most aggressive
  #                                 whole-program merge pass.
  #      - `-O3` -> `-O2`         : `-O3` whole-program opt holds more IR live
  #                                 in both wasm-ld LTO codegen and wasm-opt.
  #                                 `-O2` keeps full dead-code elimination
  #                                 (output stays ~48 MB) at much lower peak.
  #      - `-Wl,--lto-O1`         : explicitly caps the LTO backend opt level,
  #                                 the single biggest lever on wasm-ld RSS.
  #   Other flags are the upstream `customBuildSchema.py` defaults verbatim:
  #   -fexceptions / -sDISABLE_EXCEPTION_CATCHING=0 : OCCT throws C++ exceptions
  #   -sEXPORT_ES6=1              : ESM module (Vite `import ocFactory from ...`)
  #   -sUSE_ES6_IMPORT_META=0     : required for the Vite/Electron bundler path
  #   -sEXPORTED_RUNTIME_METHODS=['FS'] : virtual FS used for STEP/IGES I/O
  #   -sINITIAL_MEMORY=100MB / -sMAXIMUM_MEMORY=4GB / -sALLOW_MEMORY_GROWTH=1
  #   -sUSE_FREETYPE=1           : font support (text/annotation rendering)
  #   -sLLD_REPORT_UNDEFINED     : surface undefined symbols at link time
  #   --no-entry                 : library module, no main()
  emccFlags:
    - -fexceptions
    - -sDISABLE_EXCEPTION_CATCHING=0
    - -O2
    - -Wl,--lto-O1
    - -sEXPORT_ES6=1
    - -sUSE_ES6_IMPORT_META=0
    - -sEXPORTED_RUNTIME_METHODS=['FS']
    - -sINITIAL_MEMORY=100MB
    - -sMAXIMUM_MEMORY=4GB
    - -sALLOW_MEMORY_GROWTH=1
    - -sUSE_FREETYPE=1
    - -sLLD_REPORT_UNDEFINED
    - --no-entry

# additionalCppCode is a TOP-LEVEL field (confirmed against the upstream
# `customBuildSchema.py`). It is injected before the EMSCRIPTEN_BINDINGS block.
# generateBindings.py auto-prepends ALL OCCT #include statements, so this code
# must NOT add its own #include directives — every OCCT header is already in
# scope (Geom_BSplineSurface.hxx, Geom_Surface.hxx, Standard_Transient.hxx ...).
#
# PURPOSE: the prebuilt build exposes Geom_BSplineSurface_1(...) which returns a
# raw Standard_Transient. Every surface-consuming API (BRepBuilderAPI_MakeFace_8/
# _14, GeomLProp_SLProps, GeomConvert) needs a Handle_Geom_Surface smart pointer,
# and there is no exposed path to wrap a fresh transient into a Handle. The
# helper class below provides that path. A class is used (not a free function)
# because the opencascade.js binding generator only binds class-scoped symbols.
#
# Geom_BSplineSurface derives from Geom_BoundedSurface -> Geom_Surface ->
# Geom_Geometry -> Standard_Transient, so the Handle upcasts implicitly to
# Handle(Geom_Surface) at the JS call sites that need it.
additionalCppCode: |
  // ---- ArchDisc: Handle wrapper for freshly-constructed B-spline surfaces ----
  class ArchDiscHandleHelper {
  public:
    // Wrap an existing Geom_BSplineSurface pointer into an owning Handle.
    static Handle(Geom_BSplineSurface) handleFromBSplineSurface(
        Geom_BSplineSurface* s) {
      return Handle(Geom_BSplineSurface)(s);
    }
    // Wrap a raw Standard_Transient (what Geom_BSplineSurface_1 returns to JS)
    // into a Handle(Geom_BSplineSurface) via a checked down-cast.
    static Handle(Geom_BSplineSurface) handleFromTransient(
        Standard_Transient* raw) {
      return Handle(Geom_BSplineSurface)(
          dynamic_cast<Geom_BSplineSurface*>(raw));
    }
  };

# TypeScript .d.ts generation stays on so the loader keeps full typings.
generateTypescriptDefinitions: true
