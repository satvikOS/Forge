<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="ArchDisc">
  <!-- ArchDisc — minimalist Greek mark: a Greek temple arch set within a disc. -->
  <!-- Monochrome, monoline; recolour via the stroke value. -->
  <circle cx="48" cy="48" r="40" stroke="#11151C" stroke-width="5"/>
  <g stroke="#11151C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- arched lintel (semicircle) -->
    <path d="M36 45 A12 12 0 0 0 60 45"/>
    <!-- twin columns -->
    <path d="M36 45 V66"/>
    <path d="M60 45 V66"/>
    <!-- stylobate / base -->
    <path d="M30 66 H66"/>
  </g>
</svg>
