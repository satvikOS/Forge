appId: com.archdisc.forge
productName: ArchDisc Forge
copyright: Copyright © 2026 ArchDisc Inc.

directories:
  output: dist-electron
  buildResources: electron

files:
  - electron/**/*
  - frontend/dist/**/*
  - "!node_modules/**/*"
  - "!backend/**/*"
  - "!e2e/**/*"
  - "!test-results/**/*"

extraMetadata:
  main: electron/main.js

# Publish every build to GitHub Releases. electron-updater reads the
# generated channel files (latest.yml / latest-mac.yml / latest-linux.yml)
# from the release assets to drive auto-update.
publish:
  provider: github
  owner: satvikOS
  repo: archdisc-Mech
  releaseType: release

# ---------------------------------------------------------------- Windows
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ArchDiscForge-Setup-${version}.${ext}
  # NOTE: no code-signing cert configured — builds are UNSIGNED. Windows
  # SmartScreen will warn on first launch. Provide an Authenticode cert
  # (CSC_LINK / CSC_KEY_PASSWORD secrets) to sign.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ArchDisc Forge

# ------------------------------------------------------------------ macOS
mac:
  category: public.app-category.graphics-design
  target:
    # dmg = the installer users download.
    # zip = REQUIRED by electron-updater for macOS auto-update.
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ArchDiscForge-${version}-${arch}.${ext}
  hardenedRuntime: true
  # NOTE: no Apple Developer cert configured — builds are UNSIGNED and
  # NOT notarized. macOS Gatekeeper will block first launch (right-click >
  # Open to bypass). macOS auto-update is unreliable without notarization.
  # Provide CSC_LINK / CSC_KEY_PASSWORD + APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
  # / APPLE_TEAM_ID secrets and set notarize: true to sign + notarize.
  identity: null

dmg:
  artifactName: ArchDiscForge-${version}-${arch}.${ext}

# ------------------------------------------------------------------ Linux
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Graphics
  artifactName: ArchDiscForge-${version}-${arch}.${ext}
