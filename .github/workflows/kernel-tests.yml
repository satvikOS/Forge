name: Kernel + Guards

# Native-C++-first CI for Forge.
#
# 2026-08-28 (Sacrosanct 3.1 alignment): the Electron desktop release pipeline
# (build-app.yml) and the AWS deployment guide were REMOVED. Forge's desktop
# client is being rebuilt ground-up in native C++ (Qt 6 Widgets + KDDockWidgets
# + a single Diligent/Metal viewport, Sacrosanct s19.2), so an Electron
# installer/auto-update pipeline no longer describes a product we ship. The
# `guards` job went with it: it existed only to npm-install `frontend/` and run
# the React/Electron brand-guard, deps-allowlist, and bridge-prompt contract
# tests. None of those describe the C++ target.
#
# What remains is ordered by Sacrosanct authority:
#
#   native   (ubuntu, PRIMARY)  pure C++20 in-house kernel gate. No OCCT, no
#                               npm, no WASM, no vendor deps. This is the gate
#                               that speaks for the product.
#   scoring  (ubuntu, fast)     kernel-side ForgeCADScore self-tests. Kernel
#                               logic, no frontend install.
#   kernel   (macOS, heavy)     TRANSITIONAL. Builds forge-kernel.node against
#                               homebrew OCCT 7.9 and runs the smoke suites.
#                               This is the ONLY coverage the OCCT-linked kernel
#                               has today, so it is retained deliberately until
#                               its native C++ test harness exists and parity is
#                               proved. It is tracked as a deletion target in
#                               implementation/sacrosanct/ZERO_JS_MIGRATION_MANIFEST.md
#                               and MUST NOT be removed by extension alone.
#
# Hardware-calm: no job `needs` another, so an OCCT-env hiccup surfaces as one
# red check instead of blocking the pure-C++ gate.

on:
  push:
    branches: [archdisc, 'claude/sacrosanct-**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native C++ kernel gate (pure C++20, no deps)
    # In-house pure-C++ kernel gates (forge::native) — NO OCCT, NO deps, NO WASM,
    # so this runs on ubuntu with just a C++20 compiler. The gate compiles ~125
    # native sources once, then compiles AND LINKS each of ~121 tests against the
    # whole object set. On a 4-core runner that is ~45 min cold; ccache makes warm
    # runs minutes. 120 covers cold.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-native-${{ runner.os }}-${{ hashFiles('forge-kernel/src/native/**', 'forge-kernel/include/forge/native/**') }}
          restore-keys: |
            ccache-native-${{ runner.os }}-
      - name: Build + run in-house native kernel gates (pure C++, no deps, no WASM)
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=2G --zero-stats
          bash forge-kernel/test/native/run_native.sh
          ccache --show-stats

  scoring:
    name: ForgeCADScore self-tests (kernel-free)
    # Kernel-side scoring logic. Deliberately does NOT install frontend/ — these
    # two self-tests are kernel scoring formulae, not app guards. They remain on
    # the Node runner only until the scorer's C++ entry point lands; tracked in
    # the zero-JS migration manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ForgeCADScore v2 canonical-formula self-test
        run: node forge-kernel/test/cadscore_v2_selftest.mjs
      - name: ForgeCADScore mechanism-axis self-test
        run: node forge-kernel/test/mechanism_axis_selftest.mjs

  kernel:
    name: OCCT kernel smoke (TRANSITIONAL — pending native C++ harness)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native build deps (OCCT 7.9 / Eigen / Boost / CMake)
        run: brew install opencascade eigen boost cmake
      - name: Report OCCT version (C0 pin checks this)
        run: |
          grep -h OCC_VERSION_COMPLETE \
            /opt/homebrew/opt/opencascade/include/opencascade/Standard_Version.hxx || true
      - name: Install root deps (cmake-js, node-addon-api)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Configure + build native kernel (.node)
        run: npm run forge:kernel
      - name: Kernel smoke suite
        run: npm run forge:kernel:test
      - name: Coherence + logic scorer (random scenes each run)
        run: npm run forge:coherence
      - name: Native binding smoke (forge.native.* callable in-platform)
        run: node forge-kernel/test/native_binding_smoke.js
