name: Kernel + Guards

# Native-C++-first CI for Forge.
#
# 2026-08-28 (Sacrosanct 3.1 alignment): the Electron desktop release pipeline
# (build-app.yml) and the AWS deployment guide were REMOVED. Forge's desktop
# client is being rebuilt ground-up in native C++ (Qt 6 Widgets + KDDockWidgets
# + a single Diligent/Metal viewport, Sacrosanct s19.2), so an Electron
# installer/auto-update pipeline no longer describes a product we ship. The
# `guards` job went with it: it existed only to npm-install `frontend/` and run
# the React/Electron brand-guard, deps-allowlist, and bridge-prompt contract
# tests. None of those describe the C++ target.
#
# What remains is ordered by Sacrosanct authority:
#
#   native   (ubuntu, PRIMARY)  pure C++20 in-house kernel gate. No OCCT, no
#                               npm, no WASM, no vendor deps. This is the gate
#                               that speaks for the product.
#   scoring  (ubuntu, fast)     kernel-side ForgeCADScore self-tests. Kernel
#                               logic, no frontend install.
#   kernel   (macOS, heavy)     TRANSITIONAL. Builds forge-kernel.node against
#                               homebrew OCCT 7.9 and runs the smoke suites.
#                               This is the ONLY coverage the OCCT-linked kernel
#                               has today, so it is retained deliberately until
#                               its native C++ test harness exists and parity is
#                               proved. It is tracked as a deletion target in
#                               implementation/sacrosanct/ZERO_JS_MIGRATION_MANIFEST.md
#                               and MUST NOT be removed by extension alone.
#   desktop  (macOS, heavy)     THE APPLICATION WE SHIP. Compiles the
#                               forge-desktop CMake project -- forge_desktop
#                               itself plus its three headless gates -- and runs
#                               forge-desktop/test/run_desktop.sh, which drives
#                               both gates AND proves all 17 of their mutations
#                               turn red. Added 2026-08-30 because no job here
#                               had ever compiled that project, so a call to a
#                               method that does not exist left the app
#                               un-buildable with every check green. See the
#                               measured negative control in the job itself.
#
# Hardware-calm: no job `needs` another, so an OCCT-env hiccup surfaces as one
# red check instead of blocking the pure-C++ gate.

on:
  # push is deliberately limited to the integration target. A feature branch that matches a push
  # filter AND has an open PR fires BOTH triggers, and no concurrency key collapses them: a push
  # event carries a null github.event.pull_request and falls back to refs/heads/<branch>, while the
  # PR event uses refs/pull/<n>/merge. Two different keys, two full runs — observed as 33151110282
  # and 33151114401 on the same sha. pull_request already covers feature branches, so this removes
  # the duplicate at the source rather than trying to key around it.
  push:
    branches: [archdisc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native C++ kernel gate (pure C++20, no deps)
    # In-house pure-C++ kernel gates (forge::native) — NO OCCT, NO deps, NO WASM,
    # so this runs on ubuntu with just a C++20 compiler. The gate compiles ~125
    # native sources once, then compiles AND LINKS each of ~121 tests against the
    # whole object set. On a 4-core runner that is ~45 min cold; ccache makes warm
    # runs minutes. 120 covers cold.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ccache
        run: |
          # The runner image ships Microsoft's apt repos. Neither gate needs them, and
          # on 2026-08-29 they returned 403/'no longer signed', which made
          # `apt-get update` exit 100 and failed this job in 17 s while an identical
          # apt step in the OCCT job passed on the same run. Dropping repositories we
          # do not use means a third-party outage cannot break our build. This weakens
          # nothing: ccache and the OCCT headers both come from Ubuntu's own archive.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/microsoft.list || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-native-${{ runner.os }}-${{ hashFiles('forge-kernel/src/native/**', 'forge-kernel/include/forge/native/**') }}
          restore-keys: |
            ccache-native-${{ runner.os }}-
      - name: Build + run in-house native kernel gates (pure C++, no deps, no WASM)
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=2G --zero-stats
          bash forge-kernel/test/native/run_native.sh
          ccache --show-stats

  scoring:
    name: ForgeCADScore self-tests (kernel-free)
    # Kernel-side scoring logic. Deliberately does NOT install frontend/ — these
    # two self-tests are kernel scoring formulae, not app guards. They remain on
    # the Node runner only until the scorer's C++ entry point lands; tracked in
    # the zero-JS migration manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ForgeCADScore v2 canonical-formula self-test
        run: node forge-kernel/test/cadscore_v2_selftest.mjs
      - name: ForgeCADScore mechanism-axis self-test
        run: node forge-kernel/test/mechanism_axis_selftest.mjs

  ui:
    name: forge::ui workstation gates (headless, no ImGui, no GPU)
    # Pure C++20 services — command registry, typed selection, keymap, dock model, feature-tree
    # model. Nothing here includes an ImGui header, which is why it runs headless in CI: the ImGui
    # frame builder is a CONSUMER of this state, not its owner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: forge::ui gates
        run: bash ui/test/run_ui.sh
      - name: run_ui.sh self-protection contracts
        # run_ui.sh gates forge::ui; this gates run_ui.sh. All three cases are
        # silent-green failures -- an unresolvable repo root that keeps going, a
        # cleanup that cannot report a delete it failed to make, and ONLY=<typo>
        # exiting 0 after running nothing.
        run: bash ui/test/run_ui_contract_test.sh
      - name: Archie op vocabulary is still what the sources imply
        # implementation/sacrosanct/archie_op_vocabulary.json is the closed list of
        # feature-IR ops Archie may emit -- the ops a USER can reach through this
        # registry. archie_op_vocabulary_test.cpp (run by run_ui.sh above) proves the
        # file matches the RUNNING code; this proves it matches the SOURCE TEXT, which
        # is the half that catches a kernel-header signature change nothing in ui/
        # would notice. Stdlib-only Python, no install step.
        run: python3 implementation/sacrosanct/tools/gen_archie_op_vocabulary.py --check
      - name: op-constraint bridge (drift check + 9 mutations)
        # The bridge is the vocabulary made ENFORCEABLE: it accepts or refuses a
        # proposed op plan against the user-invocable ops. run_ui.sh above already
        # runs its clean pass (it globs ui/test/*_test.cpp); this step is the half a
        # clean pass cannot give -- the PROOF that the gate can fail. It mutates the
        # generated header to prove the drift check refuses, then runs every --mutate
        # case and requires every one to exit non-zero.
        #
        # The op COUNT is deliberately not written here any more. It was "28" while
        # the gate proved 9 mutations under a name saying 8, and the true count went
        # 28 -> 29 with #165 -- a number copied into a second place goes stale
        # (D-027), and this file cannot be regenerated. The authority is
        # archie_op_vocabulary.json counts.user_invocable_ops, which the step above
        # gates. The mutation count stays written because ci_desktop_gate.sh's
        # EXPECTED_MUTATIONS idiom requires an exact figure to be falsifiable.
        run: bash ui/test/run_op_constraint_gate.sh
      - name: two-path differential, tier 1 (kernel-free, + 9 mutations)
        # ONE feature tree can reach the kernel two ways -- forge_verify's
        # compileText, and commands -> OpConstraintBridge -> PartDocument ->
        # KernelScene -- and NOTHING compared them. This tier needs no kernel: it
        # requires the app-authored IR to be byte-identical to the planner's IR,
        # requires the bridge to accept what the app itself emitted, and measures
        # the ARITY DIFFERENTIAL (kernel-legal argument counts the bridge refuses)
        # against a two-directional ratchet. run_ui.sh above runs its clean pass;
        # this step is the PROOF that it can fail.
        #
        # It also drives the arm the invariant actually names: the real
        # ArchieCopilot::submit/deliver/apply, whose plan steps carry a SYMBOLIC
        # target rather than a %ref, so `resolveSelection` CHOOSES the operands at
        # apply time. That arm found two live defects on its first run -- every
        # two-body boolean ran the wrong way round, and PlanSelect could not name
        # the WIRE kind so LOFT was unreachable -- and it RATCHETS the divergence
        # SET, so the one that remains (an open-ended selection gets minCount
        # values and no more) is printed on every run rather than remembered.
        run: bash ui/test/run_differential_gate.sh
      - name: forge-desktop still TYPE-CHECKS (the cheap half of "the app builds")
        # THE GATE THAT WOULD HAVE CAUGHT 2026-08-31's UN-BUILDABLE APP, IN THIS
        # JOB, IN SECONDS.
        #
        # forge::ui::DocumentHost grew a PURE virtual (documentReset) and
        # ForgeFrame, the application's only DocumentHost, did not implement it.
        # `class ForgeFrame final` therefore named an abstract class and
        # forge-desktop did not compile. Every step ABOVE stayed green: they all
        # build ui/src and ui/test and none of them touches forge-desktop/src.
        # It is the same shape as #107 (a call to KernelScene::features(), which
        # did not exist), and #107 is why the `desktop` job exists.
        #
        # The `desktop` job WOULD catch both -- it compiles and links the real
        # application -- but it installs OCCT, builds forge_kernel_core, links
        # ImGui and runs six gates under a sanitizer. That is minutes, on a
        # runner with an SDK. This step is `-fsyntax-only`: full parse, template
        # instantiation and type checking, NO codegen and NO link, over the 12
        # forge-desktop translation units that need no external SDK. Dear ImGui
        # is vendored in-tree and forge::ui is in-tree, so it needs clang and the
        # checkout and nothing else -- which is exactly why it can ride THIS job.
        #
        # --mutations runs it clean and then proves all three injected defects
        # turn it red (a removed override of a pure virtual, a call to a method
        # that does not exist, and a plain -Wunused-variable that only fails
        # because -Werror is kept). A gate nobody has seen fail is silence, and
        # silence is the exact failure mode this step is here to end. The
        # mutations are injected into a COPY of the tree, never the checkout.
        #
        # The gate also CENSUSES forge-desktop/{src,test}: every .cpp must be
        # classified as checked or as skipped-with-the-SDK-it-needs, so a new
        # translation unit cannot join the application unnoticed.
        run: bash forge-desktop/test/run_syntax_gate.sh --mutations

  retrieval:
    name: SearXNG client + redaction (incl. network-denied phase)
    # Phase 1 runs the gate normally; phase 2 re-runs the ENTIRE gate under an LD_PRELOAD/
    # DYLD_INSERT_LIBRARIES interposer that aborts a real socket(). Law 13 says every non-browser
    # function must behave identically with the network denied — phase 2 is that proof.
    # macOS, deliberately. Phase 2 re-runs the WHOLE gate under a __DATA,__interpose dyld
    # interposer that aborts a real socket() — that is the Law 13 / s12.4 proof this job is NAMED
    # after, and it is macOS-only. Running it on ubuntu-latest meant phase 2 silently skipped while
    # the check went green carrying "incl. network-denied phase" in its title. The script now hard
    # fails on a platform where the proof cannot run, so this can never regress into a silent skip.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: retrieval gates (phase 1 + network-denied phase 2)
        run: bash retrieval/run_retrieval_tests.sh

  s0_conformance:
    name: s0 Appendix B conformance ratchet + the SECTION op gate
    # The acceptance suite deliberately asserts laws the implementation does not yet satisfy, so its
    # RAW exit is 1 by design and its failures are the deliverable. A permanently-red gate teaches
    # people to ignore it, so CI applies a ratchet: red if the failure count RISES (a regression)
    # and red if it FALLS (lower the committed baseline in the same commit, so a stale baseline can
    # never silently re-admit a regression). Green only at the exact known-gap count.
    # Runs on macOS, deliberately. The suite exercises parse() only and leaves ~20 forge::* kernel
    # symbols unresolved; Apple's ld resolves those LAZILY under -undefined dynamic_lookup, so an
    # unreferenced symbol never has to exist. GNU ld has no equivalent: --unresolved-symbols=
    # ignore-all links successfully and then the loader refuses the binary at startup with
    # "unexpected PLT reloc type 0x00" (exit 127). The two flags are not equivalent, and pretending
    # they were is what kept this gate red.
    #
    # The real fix is to split parse() into its own translation unit so the link is complete rather
    # than permissive. That is deferred because FeatureTreeCompiler.cpp carries large uncommitted
    # work in the main checkout and the edit would conflict — see RECONCILIATION_OWED.md. Until
    # then the gate runs where its linker semantics genuinely exist.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The s0 suite needs only the HEADERS; the SECTION gate below links the
      # toolkits too, and one brew formula carries both.
      - name: Install OCCT
        run: brew install opencascade
      - name: s0 ratchet
        run: bash forge-kernel/test/ft/s0_ratchet.sh
      # SECTION is the fourth OCCT boolean and the only one of the four whose
      # result is not a body: FUSE/CUT/COMMON return a solid, SECTION returns the
      # curve where two bodies' faces cross. forge::ft's kindOf() ends in
      # `default: return Val::Solid`, so an op that does not name itself there is
      # silently typed a body — and every downstream measurement would then report
      # a perfectly good section as an empty invalid solid.
      #
      # This gate lives in the same job because it needs the same thing this job
      # already installs and the same linker semantics this job already documents:
      # it calls forge::section() and forge::ft::parse(), and parse() shares a
      # translation unit with compile(), whose ~20 further kernel symbols are
      # referenced but never executed. Six TUs, no kernel build, well under a
      # minute. It runs its own three mutations and requires each to turn it red.
      - name: SECTION op gate (geometry + IR round trip + 3 mutations)
        run: bash forge-kernel/test/build_section_op_gate.sh

  nafems_ratchet_selftest:
    name: NAFEMS ratchet — prove the gate can fail
    # SR-3: a gate whose failure path cannot produce a non-zero exit is not a gate. Until
    # 2026-08-28 fea_nafems_gate.mjs printed FAIL for a missed NAFEMS benchmark and still
    # exited 0. The ratchet that replaces it is therefore not trusted on its say-so: this
    # job drives every one of its documented red paths with stub gates and asserts each
    # exit code. No kernel build needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: NAFEMS ratchet self-test
        run: bash forge-kernel/test/fea_nafems_ratchet_selftest.sh

  desktop_update:
    name: auto-update path — and prove the gate can fail
    # macOS, and not by preference: the update path IS macOS. It stages with
    # ditto, checks an ad-hoc code signature with codesign, clears
    # com.apple.quarantine with xattr, and swaps the bundle with
    # renamex_np(RENAME_SWAP). None of those exist on ubuntu, so a Linux runner
    # could only test the arithmetic and would report green on a path that had
    # never been exercised.
    #
    # NO KERNEL BUILD. libforge_updater deliberately links nothing but libc++ —
    # not OCCT, not SDL, not Vulkan, not the kernel — so this whole job is two
    # compiler invocations and finishes in under a minute. That is the point: an
    # update path that could only be checked after a 40-minute OCCT build is an
    # update path nobody would check.
    #
    # NO NETWORK. The only networked function in the updater is Fetcher::get, and
    # the gate injects a fetcher that copies a local file. The flags that make a
    # real download safe are asserted by building curlArgv() and reading it,
    # which tests more than watching a download succeed would.
    #
    # SR-3: the second half of this job is the negative control. Seven mutations,
    # each a defect a maintainer could plausibly write — a lexicographic version
    # compare, a skipped sha256, a non-atomic swap — and each MUST make the gate
    # go red. A mutation that stops being caught fails the job.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: update gate + all seven negative controls
        run: bash forge-desktop/test/run_update_gate.sh --mutations
      - name: the release pipeline and the app agree on the appcast
        # The producer is bash (forge-desktop/emit_appcast.sh) and the consumer
        # is C++ (src/update/Manifest.cpp) with a parser stricter than json.load.
        # Two halves of one contract that had never been run together.
        run: bash forge-desktop/test/appcast_selftest.sh
      - name: the packager still stages the library nothing can SEE it needs
        # `brew install sdl2` installs sdl2-compat, whose libSDL2 dlopen()s SDL3.
        # A dlopen is not a link record, so a dependency walk seeded from
        # `otool -L` stages nothing and the shipped bundle dies in a MODAL
        # NSAlert inside a library constructor, before main(). That fix was
        # written, proven at 80 ms (run 33445851975), and then LOST in a rewrite;
        # run 33644564583 reproduced the hang on 2026-09-02. A comment did not
        # survive the rewrite, so this does. --mutations is the negative control:
        # three ways to break the staging, each of which must turn this red.
        run: bash forge-desktop/test/sdl3_staging_gate.sh --mutations
      - name: the release path, the appcast and the bundle name the same artifact
        # The gap the step above it does NOT cover. appcast_selftest proves the
        # emitter writes a DOCUMENT the app accepts. Nothing proved that the
        # document describes THE RELEASE.
        #
        # The artifact's name is spelled three times, in three files nothing
        # compares: package_macos.sh creates the zip, desktop-release.yml uploads
        # it, emit_appcast.sh puts it in the payload URL. Change one and all
        # three files still pass every other gate — and the release ships with an
        # appcast pointing at a 404, which no CI run can see because the first
        # reader is an installed copy on a user's machine.
        #
        # It also asserts the two executables whose absence is SILENT reach the
        # bundle: forge_kernel_worker (crash isolation) and forge_update (the
        # only code in the product that can INSTALL a release — without it the
        # app detects updates it can never apply).
        #
        # Cheap enough to ride a PR: it reads sources and compiles ONE small C++
        # checker. Seven mutations are the negative control.
        run: bash forge-desktop/test/release_contract_gate.sh --mutations

  release_visibility:
    name: could an installed Forge actually SEE the latest release?
    # SEPARATE from desktop_update on purpose. That job documents itself as
    # having NO NETWORK — every decision in the updater is a pure function and it
    # injects a fetcher that copies a local file — and putting a live API call
    # inside it would quietly make that sentence false.
    #
    # This asks the one question no offline gate can: given what is PUBLISHED
    # right now, would a running copy of Forge find it? The app fetches
    # releases/latest/download/appcast.json, and GitHub's `latest` skips drafts
    # AND prereleases. The release workflow creates every release as a draft, so
    # the failure is one careless checkbox away and is silent in the worst way —
    # nothing errors, no release is malformed, and every shipped copy is frozen
    # for ever.
    #
    # MEASURED 2026-09-02: the repository has exactly one release, v0.1.0-alpha.0,
    # and it is BOTH a draft AND a prerelease with zero assets. Publishing it
    # alone would therefore still not make it `latest` — the prerelease flag has
    # to come off too. That is precisely the kind of thing this job exists to say
    # out loud instead of leaving it to be discovered by a user.
    #
    # --allow-unreleased tolerates EXACTLY ONE condition: zero published
    # releases, which before the first tag is the state the project is
    # deliberately in and which no pull request can change. Everything else stays
    # hard — the moment a release is published it must carry an appcast.json and
    # a zip, and an unreachable API is a failure, never a quiet pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: prove the check fires in BOTH directions (offline, stubbed gh)
        # FIRST, and with no network at all. Against the live repository the
        # check can currently only return one answer -- nothing is published --
        # so every observation of it is consistent with a script that
        # unconditionally exits 1, and the live step below would prove nothing.
        #
        # This stubs `gh` on PATH and drives twelve arms from fixtures: the
        # positive control (published + appcast + zip -> GREEN), the two states
        # GitHub's `latest` skips, the two where `latest` resolves and the
        # release is still useless, and four that pin down --allow-unreleased --
        # that it tolerates "nothing published yet" and NOTHING else. Publishes
        # nothing, deletes nothing, needs no authentication.
        run: bash forge-desktop/test/release_visibility_check_selftest.sh
      - name: is the newest release reachable by an installed copy?
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash forge-desktop/test/release_visibility_check.sh --allow-unreleased

  simulation:
    name: real-time simulation frame contract (SR-4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT headers (Debian packages)
        run: |
          # The runner image ships Microsoft's apt repos. Neither gate needs them, and
          # on 2026-08-29 they returned 403/'no longer signed', which made
          # `apt-get update` exit 100 and failed this job in 17 s while an identical
          # apt step in the OCCT job passed on the same run. Dropping repositories we
          # do not use means a third-party outage cannot break our build. This weakens
          # nothing: ccache and the OCCT headers both come from Ubuntu's own archive.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/microsoft.list || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev
          ls -d /usr/include/opencascade >/dev/null
      - name: simulation gates
        run: bash simulation/run_simulation_tests.sh
        env:
          OCCT_INCLUDE: /usr/include/opencascade

  kernel:
    name: OCCT kernel smoke (TRANSITIONAL — pending native C++ harness)
    runs-on: macos-latest
    # 75, raised from 40, and the reason is MEASURED -- including one estimate
    # that measurement then REFUTED, which is why the ceiling is set where it is.
    #
    # This job hit exactly 40m21s on this branch and GitHub reported it as
    # `cancelled`, the same word a concurrency cancel uses. It was a JOB TIMEOUT.
    # Not a hang: the step the clock ran out on had been running 94s, every step
    # before it had passed, and the seven after it report `skipped`.
    #
    # THE FIRST DIAGNOSIS WAS WRONG. It looked like growth alone --
    #   22m26s  archdisc before this wave          run 33594358596
    #   34m08s  + #176's sketch/constraint gate    run 33644735933
    # -- so adding this branch's two-path differential (tier-2 alone was 850s)
    # predicted ~48m, and 48 > 40 seemed to be the whole story.
    #
    # RE-RUNNING THE SAME COMMIT REFUTED THAT: run 33657049314, byte-identical
    # content, finished in 34m19s -- INSIDE the old 40m ceiling. Every step was
    # faster (tier-2 850s -> 719s, crash-isolation 740s -> 552s, A/B 334s
    # nominal); about 7 minutes of pure runner variance separates the two.
    #
    # So the real finding is not "the job needs 48 minutes". It is that this
    # job's cost is a DISTRIBUTION, roughly 34-41 minutes on macos-latest, and
    # 40 was sitting in the middle of it -- which is exactly why the same
    # content passed on #176 and #174 and died here. A ceiling inside the
    # variance band makes the outcome a coin toss and the failure unreadable,
    # because a timeout is spelled `cancelled`.
    #
    # 75 puts the ceiling clear of the band with room for the next gate, and is
    # still far below the 180 that let three earlier timeouts read as
    # infrastructure noise. Re-measure when a step is added -- and re-run before
    # concluding, because one sample cannot tell growth from variance.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native build deps (OCCT 7.9 / Eigen / Boost / CMake)
        run: brew install opencascade eigen boost cmake
      - name: Report OCCT version (C0 pin checks this)
        run: |
          grep -h OCC_VERSION_COMPLETE \
            /opt/homebrew/opt/opencascade/include/opencascade/Standard_Version.hxx || true
      - name: Install root deps (cmake-js, node-addon-api)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Configure + build native kernel (.node)
        run: npm run forge:kernel
      # THE LEDGER RATCHET. OCCT_CLOSURE is the single number the whole
      # dependency-drop programme is scored by, and until now NOTHING gated it:
      # `grep -rn 'occt_closure_count\|tkoffset_ledger_gate' .github/ package.json`
      # returned zero hits, so scripts/tkoffset_ledger_gate.sh -- which is
      # well-written and encodes exactly these ceilings -- was invoked by no
      # workflow, no npm script and no test runner.
      #
      # That is not hypothetical. The gate's own header records the regression it
      # was built to catch: a family-E wiring change silently took OCCT_PHANTOM
      # 2 -> 3, invisible on macOS (-undefined dynamic_lookup) and a hard link
      # error on Linux. Nothing today would catch that again.
      #
      # The numbers are the MEASURED state at 32ee7485, not aspirations:
      # OCCT_DIRECT = 9, OCCT_CLOSURE = 14, OCCT_PHANTOM = 2. They are a CEILING
      # -- the script fails when a number EXCEEDS them -- so this cannot pass by
      # accident and cannot block a genuine drop. When a toolkit is really
      # retired, lower the number in the same commit that retires it; that edit
      # is the ledger entry.
      #
      # --assert-no-phantom is deliberately NOT set. There are two phantoms today
      # (TKBO 32 symbols, TKG2d 24) and naming them is accounting worth 0
      # closure, so demanding zero here would fail the build for a defect this
      # step exists to REPORT rather than to forbid.
      - name: OCCT ledger ratchet (CLOSURE is the number; DIRECT is gameable)
        run: |
          bash forge-kernel/scripts/occt_closure_count.sh \
            --assert-closure 14 --assert-direct 9
      - name: Kernel smoke suite
        run: npm run forge:kernel:test
      - name: Coherence + logic scorer (random scenes each run)
        run: npm run forge:coherence
      - name: Native binding smoke (forge.native.* callable in-platform)
        run: node forge-kernel/test/native_binding_smoke.js
      - name: Tet4 element convergence vs Lame exact solution (observed order)
        # Hard pass/fail: the linear tetrahedron must reach its theoretical order
        # (O(h^2) displacement, O(h^1) stress) on a curved-boundary problem with a
        # closed-form answer. This is what exonerates the ELEMENT, so that the NAFEMS
        # misses below cannot be blamed on it without evidence.
        run: node forge-kernel/test/fea_tet4_convergence.mjs
      - name: NAFEMS known-answer accuracy ratchet
        # Runs fea_nafems_gate.mjs and ratchets its band misses against
        # forge-kernel/test/fea_nafems_baseline.txt. Red if the miss count OR the miss set
        # changes in either direction; red if the gate trips a kernel-correctness guard;
        # red if the result cannot be parsed. Never run the gate bare in CI -- its own exit
        # code does not cover a missed benchmark. See reports/FEA_NAFEMS_GAP.md.
        #
        # THREE axes, and BLOCKED is judged before accuracy. A case that did not run is
        # neither a pass nor a miss: LE11's ball+cone+cylinder fuse is refused on the GitHub
        # runner and succeeds on the workstation FROM THE SAME COMMIT -- measured, both are
        # macOS arm64 with the same OCCT 7.9.3, so the cause is environment-sensitivity in the
        # NATIVE boolean, not the platform, and it is not yet established (open finding).
        # Folding that into the miss count made an environment-dependent
        # kernel gap look like an accuracy change -- misses dropped 3 -> 2 here and the ratchet
        # read a CAPABILITY LOSS as an ACCURACY IMPROVEMENT, then asked for the baseline to be
        # lowered, which would have locked it in. The baseline is now a CEILING on blocked plus
        # a miss set among the cases that ran, so one committed baseline is correct on both
        # platforms. Proven by cases 11a/11b of fea_nafems_ratchet_selftest.sh, which drive the
        # two shapes against the same baseline file.
        run: bash forge-kernel/test/fea_nafems_ratchet.sh
      - name: 2D sketch + constraint gate (planegcs, reachable from the IR)
        # THE FIRST GATE THE CONSTRAINT SOLVER HAS EVER HAD. planegcs has been
        # vendored, compiled and linked into both forge_kernel.node and
        # forge_kernel_core for two months -- ~370 KB of solver source, 67
        # addConstraint* primitives, a full rank/QR diagnosis pipeline -- and
        # NOTHING exercised it: no CI job, no npm gate entry, no native test.
        # A solver this good being ungated is how it silently rots.
        #
        # This gate is weighted toward the REFUSAL paths, not the happy path,
        # because the binding constraint on this programme is that nothing may
        # refuse a tree: one contradictory dimension in a 200-statement tree
        # must not cost the other 199. It asserts a contradictory sketch still
        # compiles every statement AND names what it demoted; that a rank-BLIND
        # infeasibility (a 10/10/100 triangle, which planegcs's Jacobian-rank
        # analysis reports as perfectly fine) is still repaired via residuals;
        # and -- the negative half -- that a TYPE error is still refused, so
        # "tolerant" cannot quietly become "permissive".
        run: bash forge-kernel/test/ft/build_sketch_solve.sh
      - name: Build forge_kernel_core (node-free, for the C++ gates)
        # Same build dir and flags PR #62's forge_verify step uses, so when that merges the
        # second configure is a no-op rather than a second full build.
        run: |
          cmake -S forge-kernel -B forge-kernel/build-verify -DCMAKE_BUILD_TYPE=Release \
                -DFORGE_BUILD_NODE_ADDON=OFF -DFORGE_BUILD_DESKTOP_FOUNDATION=ON
          cmake --build forge-kernel/build-verify -j3 --target forge_kernel_core
      - name: ARC + HELIX compile probe (closed-form geometry, and HELIX's value kind)
        # PARSING IS NOT BUILDING, and the gap between them is where an arc op
        # fails silently: a profile that builds every arc as its CHORD parses
        # perfectly and returns a wrong solid with no error. s0_acceptance_test
        # covers the FORM of ARC and HELIX at parse level and cannot see any of
        # that, so this links the kernel just built above and checks a VECTOR of
        # observables against CLOSED FORMS -- volume, bbox, centre of mass and
        # surface area of an ARC D-shape; the arc length and tight bbox of the
        # helix; and the DIFFERENTIAL against POLY over the same three vertices,
        # which is 36.34% of the part and compiles green without this op.
        #
        # It also asserts the one thing no parse-level test can reach: HELIX's
        # VALUE KIND. Builder::kindOf is a private static in an anonymous
        # namespace, but refProfile prints kindName(kindOf(...)) into its
        # refusal, so `EXTRUDE(%helix, 10)` must fail with "is a WIRE, expected a
        # PROFILE" -- a kindOf returning Val::Solid would instead succeed and
        # export an EMPTY STEP as ok=true.
        #
        # It rides THIS step's build: forge_kernel_core is already compiled
        # above, so the marginal cost is one translation unit.
        # KERNEL_BUILD_REQUIRED=1: the step above built it. If it is not there the
        # step FAILS rather than silently starting a second 40-minute OCCT build
        # and then going green having proved nothing about the build in use.
        run: |
          KERNEL_BUILD=forge-kernel/build-verify KERNEL_BUILD_REQUIRED=1 \
            bash forge-kernel/test/ft/build_arc_helix_compile_probe.sh
      - name: IR pipeline gate (a forge::ui program -> forge::ft -> an asserted SOLID)
        # THE GATE THAT AUTHORISES DELETING THE JAVASCRIPT. forge::ui emits an SSA feature-IR
        # program and forge::ft can compile one, but nothing ever fed one into the other --
        # ft::compile appeared in ui/ ZERO times, and part_commands_test only compared the
        # emitted TEXT against an expected string, which is an assertion about characters and
        # not about geometry. This drives the real Part commands through the same registry the
        # app uses, parses and compiles what they emit, and asserts the solid on a VECTOR of
        # observables -- validity, face and edge counts, volume AND bbox, plus the s0.4
        # declared/parsed/compiled reconciliation. Volume alone is not accepted as proof:
        # a wrong solid matching a right volume to ten significant figures is a measured
        # failure mode in this programme, not a hypothetical one.
        run: FORGE_KERNEL_BUILD_DIR=forge-kernel/build-verify bash forge-desktop/test/run_ir_pipeline.sh
      - name: two-path differential, tier 2 (THE SOLIDS, 5 arms, mutation-swept)
        # The IR-pipeline step above proves a UI-authored program compiles to A solid. It
        # never compared that solid against anything, so a tree that builds headless and
        # builds DIFFERENTLY in the app was invisible -- the same "two artifacts from one
        # source, no gate tying them together" that produced the vocabulary/header desync
        # nine times.
        #
        # This runs FOUR arms over the shared corpus and requires all four to describe
        # the same solid: forge::ft::compileText (forge_verify's entry, where every
        # benchmark number comes from), forge::ft::parse + compile (KernelScene's entry)
        # over the IR the REAL registered commands assembled,
        # forge::desktop::KernelScene itself -- the application object, tessellation and
        # viewport de-index included -- and the forge_verify BINARY over its stdin
        # protocol.
        #
        # The comparison is a VECTOR, never volume alone: valid, faces, edges, volume,
        # area, bbox, genus, shell count, welded V/E/F, Euler characteristic, centre of
        # mass and the s0.4 census. It reuses build-verify, so it adds no build.
        # Nine deliberate divergences are injected and every one must be caught.
        #
        # A FOURTH ARM runs the forge_verify BINARY over its stdin protocol. A, B and
        # C are three entry points inside ONE process, and the defect class this whole
        # gate is named for is TWO ARTIFACTS built from one source: a stale,
        # differently-configured or differently-linked verifier is invisible to any
        # comparison that never runs it. The build below is the same one-liner the
        # batch-survival step uses later in this job -- build-verify is already
        # configured, so only forge_verify itself links -- and it is here rather than
        # there because this step runs first. Its ABSENCE is exit 3, never a skip.
        run: |
          cmake --build forge-kernel/build-verify -j3 --target forge_verify
          FORGE_KERNEL_BUILD_DIR=forge-kernel/build-verify \
            bash forge-desktop/test/run_differential_solid_gate.sh
      - name: Desktop CLICK gate (the first CI step that compiles forge-desktop/src)
        # THE GATE THAT WOULD HAVE CAUGHT BOTH OF 2026-08-30's SHIPPED DEFECTS, and the
        # first thing in CI that compiles forge-desktop/src at all.
        #
        # Until now nothing did. The IR-pipeline step above deliberately compiles only
        # ui/src plus one gate TU so it needs no SDL2/Vulkan/ImGui, and desktop-release.yml
        # was unregistered. In one day that gap let through (1) a call to a method that no
        # longer existed -- KernelScene::features() -- which made the app UNBUILDABLE for
        # hours with nothing going red, and (2) a use-after-free that SIGSEGV'd the
        # installed app on the FIRST dock-tab click. The frame and document gates passed
        # throughout: they render frames, and neither of them CLICKS anything.
        #
        # This step compiles the real ForgeFrame.cpp and KernelScene.cpp -- so defect (1) is
        # a red build here -- and then drives the real ImGui input queue to click every dock
        # tab and drag every splitter in all 8 workspaces, stepping a FURTHER frame after
        # each gesture, which is what defect (2) needed to be seen: the crash was the next
        # read through the reference the click had freed. Whole stack under
        # -fsanitize=address, because reading freed memory is not reliably a crash. 1144
        # assertions, and the script proves its own five mutations red before it goes green.
        #
        # COST: it rides THIS job, which already installed OCCT and already built
        # forge-kernel/build-verify, so the marginal spend is one clang++ pass over
        # forge::ui + 4 desktop TUs + ImGui core plus a 0.5 s run -- 35 s measured on an
        # M-series workstation, so on the order of 2-3 minutes on a macOS runner, inside a
        # job budgeted at 40. No SDL2, no Vulkan loader, no MoltenVK and no glslang are
        # installed for it: imgui_impl_vulkan.cpp is the only vendored file that needs a
        # Vulkan header and it is the one file this gate does not compile.
        run: FORGE_KERNEL_BUILD_DIR=forge-kernel/build-verify bash forge-desktop/test/run_click_gate.sh
      - name: Desktop CRASH-ISOLATION gate (a REAL SIGSEGV in a REAL worker)
        # THE GATE FOR THE ONE FAILURE MODE THAT PRODUCES NO DIAGNOSTIC AT ALL.
        #
        # forge-kernel/reports/OCCT_NULL_PCURVE_SEGV.md measured a null
        # Geom2d_Curve dereferenced INSIDE OCCT on three paths, crashing on
        # Archie's emitted geometry AND on the gold reference STEP files, and its
        # own self-corrections rule out every cheaper remedy: the crashing shape
        # had nullPcurves=0 so there is nothing on the input to repair, KeepShapes
        # was implemented and still SIGSEGV'd all six cases, and the accessor a
        # guard would call is itself a faulting frame. A SIGSEGV is not an
        # exception either -- KernelScene's catch(...) cannot see a signal.
        #
        # So the kernel runs in forge_kernel_worker and this gate proves the app
        # survives losing it, against a REAL child and a REAL fatal signal. It
        # also proves the mechanism did NOT become a capability gate: re-
        # submitting a program that just crashed must RUN IT AGAIN. Mutation S2
        # grows exactly that quarantine and must turn this red.
        #
        # Rides this job for one more clang++ pass: OCCT and
        # forge-kernel/build-verify are already here, and the gate needs no SDL2,
        # no Vulkan and no ImGui. Seven mutations, five of them injected into a
        # COPY of the production sources rather than into the test.
        run: FORGE_KERNEL_BUILD_DIR=forge-kernel/build-verify bash forge-desktop/test/run_isolation_gate.sh
      - name: live-OCCT A/B harnesses (ratcheted; a link failure is RED, not silence)
        # THE GATE THAT WOULD HAVE CAUGHT PR #64. Two harnesses -- thicken and loftpipe --
        # stopped LINKING the moment that PR merged, because it made their engines call
        # forge::occtPrism / occtCylinderSolid while they compile the engine STANDALONE
        # without src/OcctPrimBuilder.cpp. 541 assertions stopped running and nothing said
        # so, because CI ran neither. A gate that cannot build is a gate that cannot fail.
        # run_ab_all.sh therefore treats a BUILD/LINK failure as RED (exit 2) and never as
        # "0 failures", and ratchets each harness against test/ab_native_baseline.txt in
        # the same idiom as the NAFEMS and s0 ratchets: red if a count RISES, red if it
        # FALLS without the baseline being lowered in the same commit. All seven run in
        # about 93 seconds on this runner, which already has OCCT installed.
        run: bash forge-kernel/test/run_ab_all.sh
      - name: unifyFaces coaxial-wall guard (a SIGSEGV gate, not an accuracy gate)
        # ShapeUpgrade_UnifySameDomain SIGSEGVs on two coaxial equal-radius walls stored
        # differently (analytic cylinder vs extrusion-of-circle). A crash here takes the
        # whole verifier process down, so before the guard a single such row silently
        # invalidated every row that followed it in the same emission run. The gate asserts
        # BOTH halves: three crashers must come back as the RIGHT solid (checked against the
        # closed-form volume, plus face/edge/shell counts -- volume alone is not accepted as
        # proof of geometry in this programme), and six shapes that already unified must not
        # move by a single count.
        run: |
          cmake --build forge-kernel/build-verify -j3 --target forge_verify
          FORGE_KERNEL_BUILD_DIR=forge-kernel/build-verify \
            bash forge-kernel/test/unify_coaxial_guard_test.sh
      - name: Build forge_verify (the native verifier)
        # forge_verify is guarded by FORGE_BUILD_DESKTOP_FOUNDATION and is NOT part of the
        # .node addon build above, so it needs its own configure. Without this the batch gate
        # below cannot find a binary and exits 3 -- deliberately red, never a silent skip.
        run: |
          cmake -S forge-kernel -B forge-kernel/build-verify -DCMAKE_BUILD_TYPE=Release \
                -DFORGE_BUILD_NODE_ADDON=OFF -DFORGE_BUILD_DESKTOP_FOUNDATION=ON
          cmake --build forge-kernel/build-verify -j3 --target forge_verify
      - name: forge_verify batch survival (one bad record must not kill the batch)
        # main() calls jsonString() six times BEFORE its first try block, and jsonUnescape()
        # used std::stoi for \uXXXX. std::stoi throws on "\uZZZZ", the throw escaped main, and
        # the process died with SIGABRT taking every LATER record with it. MEASURED on the
        # gate's own 6-record fixture: before, exit=134 with 2 of 6 emitted (3 of the 4 lost
        # records were WELL-FORMED); after, exit=0 with 6 of 6. The gate also pins the quieter
        # defect the crash was hiding -- base-16 stoi stops at the first non-hex character, so
        # "\u00ZZ" partially parsed to 0 and silently injected a NUL byte.
        run: FORGE_VERIFY_BIN=forge-kernel/build-verify/forge_verify bash forge-kernel/test/forge_verify_batch_gate.sh
      - name: a dying verifier answers for itself (unit)
        # forge_verify aborted SEVEN times during a completed 600-row run on
        # 2026-09-01 -- uncaught Standard_ConstructionError out of forge::rotate,
        # a zero-axis ROTATE reaching gp_Dir(0,0,0). An OCCT raise is not a
        # std::exception, so main's handler never matched, and the process died
        # having said nothing. All seven rows were then written down as "the tree
        # does not compile: verifier produced no output" -- a verdict on the MODEL
        # that nothing had established, and one that sat in the denominator of a
        # published self-inconsistency rate: D-045 read 389/455 = 85.5% where the
        # honest figure is 389/447 = 87.0% over the rows actually measured. The
        # correction WIDENS the result against its pre-registered prediction.
        #
        # It went unnoticed for a whole run because nothing exercised the path it
        # died on. This drives every death path in src/tools/InstrumentRecord.hpp
        # -- the header forge_verify itself ships -- in forked children, and
        # checks a record comes out of each, exactly one per row, with the
        # exception's type intact. It links no kernel and no OCCT, so it costs a
        # second.
        run: |
          cmake --build forge-kernel/build-verify -j3 --target forge_instrument_gate
          ./forge-kernel/build-verify/forge_instrument_gate
      - name: a dying verifier answers for itself (end to end)
        # The same property through the real binary, plus the half the unit gate
        # cannot see: a zero-axis ROTATE is now an ordinary per-op error that
        # NAMES the op, the batch survives it, and the row after it still builds.
        # MEASURED on this exact 3-row fixture: the pre-fix pinned binary exits
        # 134 with 1 of 3 records (the crashing row AND its innocent neighbour
        # lost, stderr "terminating due to uncaught exception of type
        # Standard_ConstructionError"); after, exit 0 with 3 of 3.
        run: FORGE_VERIFY_BIN=forge-kernel/build-verify/forge_verify bash forge-kernel/test/forge_verify_instrument_gate.sh
      - name: ... and the gate that proves it can fail (8 mutations, red-then-green)
        # THE NEGATIVE CONTROL FOR THE TWO STEPS ABOVE. The defect they exist for
        # survived a COMPLETE 600-row run because nothing exercised the path
        # forge_verify died on; a gate written in response must not be allowed to
        # acquire the same property. This breaks the SHIPPED header eight ways --
        # handler not installed, exception type lost, what() discarded,
        # afterAnswer always false, row id forgotten, record written to the wrong
        # stream, no signal handlers, and a record emitted for HEALTHY rows -- and
        # requires the gate to go red at the specific check each guarantee belongs
        # to. Red for the wrong reason fails too: "it turned red" is not evidence
        # that the check you care about is awake. The count is an equality, never
        # a floor, so a mutation that stops applying fails the job instead of
        # quietly shrinking the suite. --selftest additionally proves THIS
        # harness's own refusals fire (a no-op edit, and a mutant that stays
        # green). It compiles one translation unit with no kernel and no OCCT.
        run: bash forge-kernel/test/instrument_record_mutations.sh --selftest

  desktop:
    # The count is deliberately NOT in this name. It said "17 mutation proofs" while
    # the suite ran 24, because a number duplicated into a display string has no
    # reason to be updated with the thing it describes. ci_desktop_gate.sh pins the
    # exact figure and prints it in its verdict line, which is the copy that is
    # checked.
    name: forge-desktop compiles + its headless gates (mutation-proved)
    # THE JOB THAT WOULD HAVE CAUGHT #107, AND THE REASON IT EXISTS.
    #
    # Until this landed, NOTHING in CI compiled the forge-desktop CMake project.
    # Both `cmake -S` lines in the `kernel` job target forge-kernel and build
    # forge_kernel_core with FORGE_BUILD_DESKTOP_FOUNDATION=ON -- that is the
    # kernel's desktop-facing LIBRARY, not the application. The IR-pipeline step
    # deliberately compiles only ui/src plus one gate TU, and run_ir_pipeline.sh
    # says why in its own header: it must not drag in SDL2, Vulkan or ImGui. The
    # one workflow that does build the app, desktop-release.yml, was not
    # registered on the default branch and had therefore never run.
    #
    # So forge-desktop/src/KernelScene.cpp called scene_.features(), a method
    # that does not exist; the application we ship was UNBUILDABLE for hours;
    # and every check stayed green. A gate that cannot build cannot fail, and
    # that looks exactly like silence.
    #
    # NEGATIVE CONTROL -- MEASURED on macOS 26.6.2 arm64 at 66572e8e before this
    # job was committed, by reinstating that exact call site in a clean tree and
    # running the steps below verbatim (extracted from this file and executed
    # under GitHub's own `bash --noprofile --norc -eo pipefail`):
    #
    #   the coverage that already existed, WITH the defect present
    #       run_ir_pipeline.sh (the `kernel` job's IR-pipeline step)
    #           -> exit 0, "18 checks, 0 failures -- PASS"
    #       run_ui.sh (the whole `ui` job)
    #           -> exit 0, "ALL 14 UI GATES PASS"
    #       Both GREEN while the application would not compile. That is the
    #       blindness, reproduced, not asserted.
    #
    #   this job, WITH the defect present
    #       step "Compile forge-desktop"
    #           -> exit 1, carrying clang's
    #              forge-desktop/src/KernelScene.cpp:399:43: error: no member
    #              named 'features' in 'forge::desktop::KernelScene'
    #              and the annotation "forge-desktop did not COMPILE (rc=2);
    #              the application is un-buildable on this commit"
    #       step "forge-desktop gates + mutation proofs"
    #           -> exit 1, "[desktop] app build FAILED", verdict line absent
    #
    #   after reverting the injection from a backup copy
    #       both steps green again; 17/17 mutations red-then-green.
    #
    # And the positive control, ON THE RUNNER: run 33344905310 green in 4 min
    # 29 s, "[ci-desktop] GREEN -- verdict confirmed: [desktop] ALL FORGE
    # DESKTOP GATES PASS, and all 17 mutations proved red-then-green".
    #
    # WHAT THIS JOB DOES NOT COVER. Neither gate INTERACTS -- they build frames
    # and drive commands, but nothing clicks. The dock-tab SIGSEGV of 2026-08-30
    # (drawTabGroup holding a const DockNode& into a layout that setActiveTabAt
    # move-assigns out from under it) passed both gates throughout and would
    # pass this job too. Compiling the app is defect class 1; that is a second
    # class, and closing it needs a gate that clicks.
    #
    # COST -- MEASURED, not estimated. This job's FIRST run on a GitHub macos-15
    # runner (run 33344905310, 2026-08-31, COLD ccache) took 4 min 29 s wall,
    # end to end:
    #     set up job                                     1 s
    #     checkout                                       6 s
    #     verdict-check self-test                        1 s
    #     brew install (all nine formulae, OCCT included) 62 s
    #     record the toolchain                           3 s
    #     restore compiler cache (a miss, first run)     2 s
    #     build forge_kernel_core                        2 min 14 s
    #     compile forge-desktop                          17 s
    #     gates + all 17 mutation runs                   40 s
    #     post steps                                     3 s
    # A warm ccache removes most of the 2 min 14 s; that first run saved its
    # cache, and the key is shared with desktop-release.yml.
    #
    # Two working assumptions this run REFUTED, recorded so nobody re-derives
    # them: brew-installing OCCT on a macOS runner was taken to cost ~15 min --
    # it cost 62 s from the bottle -- and the build was extrapolated from an
    # M-series workstation (forge_kernel_core 66 s wall / 178 s CPU at -j6) as
    # ~20 min cold; it was 2 min 14 s. The whole job costs about a tenth of what
    # it was budgeted at, on one macOS runner, and it buys the first compile
    # coverage the shipped application has ever had.
    #
    # WHY NOT FOLD THIS INTO THE `kernel` JOB, which already installs OCCT and
    # already builds forge_kernel_core. On the measured numbers that would save
    # the brew install and the kernel-core build -- about 3 min 15 s of a 4 min
    # 29 s job, so most of it -- and it was still rejected. Steps within a job
    # are sequential, so the app gate would sit behind eight steps this file
    # itself documents as environment-sensitive: LE11's fuse is refused on the
    # GitHub runner and succeeds on the workstation from the same commit. Any
    # one of those hiccuping would mean the application was never compiled at
    # all, reported under a check named "OCCT kernel smoke". Coverage that
    # quietly does not run is the exact defect this job exists to end, and 4.5
    # minutes of macOS runner is a small price for not re-creating it. The
    # workflow's own rule is hardware-calm independence, and s0_conformance
    # already pays for a second full OCCT install for the same reason.
    runs-on: macos-15
    # PINNED, matching desktop-release.yml rather than the macos-latest the other
    # macOS jobs use. The release artifact is built on macos-15, so this gate
    # compiles on the image the release compiles on: a bottle or toolchain change
    # that breaks the release build turns a PR red instead of a tag.
    #
    # timeout: 30, against a MEASURED 4 min 29 s on a cold cache -- 6.7x headroom
    # for a slow bottle mirror or a contended runner. A ceiling is not a budget:
    # set generously enough that a slow day is not a false red, tight enough
    # that a hung build is killed rather than billed.
    timeout-minutes: 30
    env:
      CCACHE_DIR: /Users/runner/.ccache
      # CMake initialises CMAKE_<LANG>_COMPILER_LAUNCHER from the identically
      # named environment variable. That is how ccache reaches a build driven by
      # run_desktop.sh, without editing a script developers also run locally.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      - name: Prove the verdict check itself can fail (7 stub cases, ~1 s)
        # FIRST, before twenty minutes of brew and compiling. The last step of
        # this job does not trust run_desktop.sh's exit code; this proves that
        # distrust is real, by driving ci_desktop_gate.sh's documented red paths
        # with stub scripts -- a mutation count that FELL, one that ROSE (the
        # count is an equality, never a floor), a mutation that STAYED GREEN, a
        # failed run, a run that exited 0 printing no verdict at all, and a
        # missing run_desktop.sh -- plus one green case, without which the suite
        # would pass equally well against a script that always exits 1.
        # Needs no OCCT, no SDL2, no compiler: if someone relaxes the verdict
        # check, this is red in seconds instead of never.
        run: bash forge-desktop/test/ci_desktop_gate_selftest.sh

      - name: Install build deps (OCCT, boost, SDL2, Vulkan/MoltenVK, glslang)
        # The same formula list desktop-release.yml installs, deliberately: the
        # gate and the release must not be able to disagree about what the app
        # needs. boost is REQUIRED and not incidental -- forge-kernel's ForgeDeps
        # resolver demands it because planegcs uses boost::graph and
        # boost::math::constants, and two dispatched release dry runs died on
        # "could not resolve 'boost' 1.90.0" before it was added. Do not trim
        # this line.
        run: |
          brew update-reset >/dev/null 2>&1 || true
          brew install opencascade boost sdl2 vulkan-headers vulkan-loader molten-vk glslang cmake ccache

      - name: Record the toolchain that compiled the app
        # A build whose provenance is not written down cannot be debugged later,
        # and these versions decide both the geometry and the OS floor.
        run: |
          sw_vers
          uname -m
          cmake --version | head -1
          for f in opencascade boost sdl2 vulkan-headers vulkan-loader molten-vk glslang; do
            printf '%-16s %s\n' "$f" "$(brew list --versions "$f" || echo MISSING)"
          done

      - name: Restore compiler cache
        # Same path and key as desktop-release.yml, on purpose: same image, same
        # compiler, same sources, so a PR run warms the release build and the
        # release run warms this one. ccache is content-addressed, so sharing
        # cannot hand back a wrong object -- at worst a changed toolchain means
        # misses. Cache keys are immutable, so whichever job saves an exact key
        # first wins and the other logs "Cache already exists"; that is a notice,
        # not a failure.
        uses: actions/cache@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-desktop-${{ runner.os }}-${{ hashFiles('forge-kernel/src/**', 'forge-kernel/include/**', 'forge-desktop/src/**', 'ui/src/**') }}
          restore-keys: |
            ccache-desktop-${{ runner.os }}-

      - name: Build forge_kernel_core (node-free; the application links this)
        # Into forge-kernel/build-app, which is the directory
        # forge-desktop/CMakeLists.txt documents and the one run_desktop.sh
        # defaults to -- so this step and the script agree and neither
        # reconfigures the other's cache.
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ccache --max-size=3G --zero-stats
          cmake -S forge-kernel -B forge-kernel/build-app -DCMAKE_BUILD_TYPE=Release \
                -DFORGE_BUILD_NODE_ADDON=OFF -DFORGE_BUILD_DESKTOP_FOUNDATION=ON
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::forge-kernel configure failed (rc=$rc)"; exit 1
          fi
          cmake --build forge-kernel/build-app --target forge_kernel_core -j3
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::forge_kernel_core did not build (rc=$rc)"; exit 1
          fi
          ls -l forge-kernel/build-app/libforge_kernel_core.dylib

      - name: Compile forge-desktop (the application AND all three headless gates)
        # THIS is the step defect #107 could not have survived, and it is kept
        # separate from the gate step below so that a compile break is legible by
        # NAME in the checks list instead of buried inside a script's log.
        # run_desktop.sh drives these same two directories, so it finds this
        # build warm and its own cmake calls cost nothing.
        #
        # The four binaries are then asserted one by one, because a build step
        # that exits 0 having produced nothing is a failure mode this programme
        # keeps meeting. forge_desktop -- the application itself -- is checked
        # HERE AND NOWHERE ELSE: run_desktop.sh only ever executes the three gate
        # binaries, so without this loop the app could stop being produced and
        # every gate would still be green.
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cmake -S forge-desktop -B forge-desktop/build -DCMAKE_BUILD_TYPE=Release \
                -DFORGE_KERNEL_BUILD_DIR="$PWD/forge-kernel/build-app"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::forge-desktop configure failed (rc=$rc)"; exit 1
          fi
          cmake --build forge-desktop/build -j3
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::forge-desktop did not COMPILE (rc=$rc); the application is un-buildable on this commit"
            exit 1
          fi
          # EVERY executable forge-desktop/CMakeLists.txt adds, not a subset.
          # copilot, click, update and the forge_update CLI were absent from
          # this list while `cmake --build` compiled them, so any one of them
          # could have stopped being PRODUCED with this step still green -- and
          # the four gates among them are only run by name afterwards, which
          # reports "gate binary missing" from inside a script's log instead of
          # here, under the step whose name says the application did not build.
          missing=0
          for b in forge_desktop forge_kernel_worker forge_update \
                   forge_desktop_frame_gate forge_desktop_document_gate \
                   forge_desktop_ir_pipeline_gate forge_desktop_copilot_gate \
                   forge_desktop_click_gate forge_desktop_update_gate \
                   forge_desktop_isolation_gate; do
            if [ -x "forge-desktop/build/$b" ]; then printf 'ok       %s\n' "$b"
            else printf 'MISSING  %s\n' "$b"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the build exited 0 without producing every binary (marked MISSING above)"
            exit 1
          fi

      - name: forge-desktop gates + mutation proofs (headless -- no window, no GPU)
        # ci_desktop_gate.sh runs run_desktop.sh -- the missing-include
        # preflight, then the SIX headless gates (ir_pipeline, document, frame,
        # copilot, update, click, isolation), then the injected defects each of
        # which MUST turn its gate red -- and then JUDGES ITS OUTPUT rather than
        # trusting its exit status.
        # run_desktop.sh has no `set -e`, so its status is the status of
        # whatever ran last and a run that fell out of its own middle would exit
        # 0; the gate script requires a zero status AND no mutation reported as
        # having STAYED GREEN AND the exact verdict line naming exactly
        # EXPECTED_MUTATIONS. Its own red paths are proved by the self-test that
        # runs as the first step of this job.
        #
        # THE COUNT IS NOT REPEATED HERE. This comment said "31" while
        # ci_desktop_gate.sh pinned 40, for as long as it took four gates and
        # nine mutations to be added without anyone editing prose that no
        # process reads. A number in two places is a number that drifts, and the
        # one that decides the build is EXPECTED_MUTATIONS in
        # forge-desktop/test/ci_desktop_gate.sh -- which carries its own
        # derivation, and whose refusal to be an environment variable is what
        # makes it reviewable.
        #
        # It is a script, not inline YAML, so a developer runs the identical
        # judgement locally and the two cannot drift; and so that the self-test
        # has something to drive.
        #
        # KERNEL_BUILD and APP_BUILD are passed explicitly so run_desktop.sh
        # reuses the directories the two steps above built, rather than
        # re-deriving paths that could differ by a symlink and cause a rebuild.
        #
        # The gates' own check counts are deliberately NOT pinned, unlike the
        # mutation count. They came out IDENTICAL on the runner and on a
        # workstation -- 18 ir-pipeline / 186 document / 185 frame, run
        # 33344905310 -- so pinning them would work today. One observation is
        # not enough to say they are independent of the OCCT bottle version, and
        # a count that flips on a Homebrew bump is a red build for the wrong
        # reason. The gates assert their own contents and go red on their own;
        # the mutation count is the one number nothing else guards, which is why
        # that one is pinned and these are not.
        shell: bash
        env:
          KERNEL_BUILD: ${{ github.workspace }}/forge-kernel/build-app
          APP_BUILD: ${{ github.workspace }}/forge-desktop/build
        run: |
          set -uo pipefail
          set +e
          bash forge-desktop/test/ci_desktop_gate.sh
          rc=$?
          ccache --show-stats || true
          exit "$rc"
