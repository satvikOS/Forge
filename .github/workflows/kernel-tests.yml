name: Kernel + Guards

# Native-C++-first CI for Forge.
#
# 2026-08-28 (Sacrosanct 3.1 alignment): the Electron desktop release pipeline
# (build-app.yml) and the AWS deployment guide were REMOVED. Forge's desktop
# client is being rebuilt ground-up in native C++ (Qt 6 Widgets + KDDockWidgets
# + a single Diligent/Metal viewport, Sacrosanct s19.2), so an Electron
# installer/auto-update pipeline no longer describes a product we ship. The
# `guards` job went with it: it existed only to npm-install `frontend/` and run
# the React/Electron brand-guard, deps-allowlist, and bridge-prompt contract
# tests. None of those describe the C++ target.
#
# What remains is ordered by Sacrosanct authority:
#
#   native   (ubuntu, PRIMARY)  pure C++20 in-house kernel gate. No OCCT, no
#                               npm, no WASM, no vendor deps. This is the gate
#                               that speaks for the product.
#   scoring  (ubuntu, fast)     kernel-side ForgeCADScore self-tests. Kernel
#                               logic, no frontend install.
#   kernel   (macOS, heavy)     TRANSITIONAL. Builds forge-kernel.node against
#                               homebrew OCCT 7.9 and runs the smoke suites.
#                               This is the ONLY coverage the OCCT-linked kernel
#                               has today, so it is retained deliberately until
#                               its native C++ test harness exists and parity is
#                               proved. It is tracked as a deletion target in
#                               implementation/sacrosanct/ZERO_JS_MIGRATION_MANIFEST.md
#                               and MUST NOT be removed by extension alone.
#
# Hardware-calm: no job `needs` another, so an OCCT-env hiccup surfaces as one
# red check instead of blocking the pure-C++ gate.

on:
  # push is deliberately limited to the integration target. A feature branch that matches a push
  # filter AND has an open PR fires BOTH triggers, and no concurrency key collapses them: a push
  # event carries a null github.event.pull_request and falls back to refs/heads/<branch>, while the
  # PR event uses refs/pull/<n>/merge. Two different keys, two full runs — observed as 33151110282
  # and 33151114401 on the same sha. pull_request already covers feature branches, so this removes
  # the duplicate at the source rather than trying to key around it.
  push:
    branches: [archdisc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native C++ kernel gate (pure C++20, no deps)
    # In-house pure-C++ kernel gates (forge::native) — NO OCCT, NO deps, NO WASM,
    # so this runs on ubuntu with just a C++20 compiler. The gate compiles ~125
    # native sources once, then compiles AND LINKS each of ~121 tests against the
    # whole object set. On a 4-core runner that is ~45 min cold; ccache makes warm
    # runs minutes. 120 covers cold.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-native-${{ runner.os }}-${{ hashFiles('forge-kernel/src/native/**', 'forge-kernel/include/forge/native/**') }}
          restore-keys: |
            ccache-native-${{ runner.os }}-
      - name: Build + run in-house native kernel gates (pure C++, no deps, no WASM)
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=2G --zero-stats
          bash forge-kernel/test/native/run_native.sh
          ccache --show-stats

  scoring:
    name: ForgeCADScore self-tests (kernel-free)
    # Kernel-side scoring logic. Deliberately does NOT install frontend/ — these
    # two self-tests are kernel scoring formulae, not app guards. They remain on
    # the Node runner only until the scorer's C++ entry point lands; tracked in
    # the zero-JS migration manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ForgeCADScore v2 canonical-formula self-test
        run: node forge-kernel/test/cadscore_v2_selftest.mjs
      - name: ForgeCADScore mechanism-axis self-test
        run: node forge-kernel/test/mechanism_axis_selftest.mjs

  ui:
    name: forge::ui workstation gates (headless, no ImGui, no GPU)
    # Pure C++20 services — command registry, typed selection, keymap, dock model, feature-tree
    # model. Nothing here includes an ImGui header, which is why it runs headless in CI: the ImGui
    # frame builder is a CONSUMER of this state, not its owner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: forge::ui gates
        run: bash ui/test/run_ui.sh

  retrieval:
    name: SearXNG client + redaction (incl. network-denied phase)
    # Phase 1 runs the gate normally; phase 2 re-runs the ENTIRE gate under an LD_PRELOAD/
    # DYLD_INSERT_LIBRARIES interposer that aborts a real socket(). Law 13 says every non-browser
    # function must behave identically with the network denied — phase 2 is that proof.
    # macOS, deliberately. Phase 2 re-runs the WHOLE gate under a __DATA,__interpose dyld
    # interposer that aborts a real socket() — that is the Law 13 / s12.4 proof this job is NAMED
    # after, and it is macOS-only. Running it on ubuntu-latest meant phase 2 silently skipped while
    # the check went green carrying "incl. network-denied phase" in its title. The script now hard
    # fails on a platform where the proof cannot run, so this can never regress into a silent skip.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: retrieval gates (phase 1 + network-denied phase 2)
        run: bash retrieval/run_retrieval_tests.sh

  s0_conformance:
    name: s0 Appendix B conformance ratchet
    # The acceptance suite deliberately asserts laws the implementation does not yet satisfy, so its
    # RAW exit is 1 by design and its failures are the deliverable. A permanently-red gate teaches
    # people to ignore it, so CI applies a ratchet: red if the failure count RISES (a regression)
    # and red if it FALLS (lower the committed baseline in the same commit, so a stale baseline can
    # never silently re-admit a regression). Green only at the exact known-gap count.
    # Runs on macOS, deliberately. The suite exercises parse() only and leaves ~20 forge::* kernel
    # symbols unresolved; Apple's ld resolves those LAZILY under -undefined dynamic_lookup, so an
    # unreferenced symbol never has to exist. GNU ld has no equivalent: --unresolved-symbols=
    # ignore-all links successfully and then the loader refuses the binary at startup with
    # "unexpected PLT reloc type 0x00" (exit 127). The two flags are not equivalent, and pretending
    # they were is what kept this gate red.
    #
    # The real fix is to split parse() into its own translation unit so the link is complete rather
    # than permissive. That is deferred because FeatureTreeCompiler.cpp carries large uncommitted
    # work in the main checkout and the edit would conflict — see RECONCILIATION_OWED.md. Until
    # then the gate runs where its linker semantics genuinely exist.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT (headers only are needed)
        run: brew install opencascade
      - name: s0 ratchet
        run: bash forge-kernel/test/ft/s0_ratchet.sh

  nafems_ratchet_selftest:
    name: NAFEMS ratchet — prove the gate can fail
    # SR-3: a gate whose failure path cannot produce a non-zero exit is not a gate. Until
    # 2026-08-28 fea_nafems_gate.mjs printed FAIL for a missed NAFEMS benchmark and still
    # exited 0. The ratchet that replaces it is therefore not trusted on its say-so: this
    # job drives every one of its documented red paths with stub gates and asserts each
    # exit code. No kernel build needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: NAFEMS ratchet self-test
        run: bash forge-kernel/test/fea_nafems_ratchet_selftest.sh

  simulation:
    name: real-time simulation frame contract (SR-4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT headers (Debian packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev
          ls -d /usr/include/opencascade >/dev/null
      - name: simulation gates
        run: bash simulation/run_simulation_tests.sh
        env:
          OCCT_INCLUDE: /usr/include/opencascade

  kernel:
    name: OCCT kernel smoke (TRANSITIONAL — pending native C++ harness)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native build deps (OCCT 7.9 / Eigen / Boost / CMake)
        run: brew install opencascade eigen boost cmake
      - name: Report OCCT version (C0 pin checks this)
        run: |
          grep -h OCC_VERSION_COMPLETE \
            /opt/homebrew/opt/opencascade/include/opencascade/Standard_Version.hxx || true
      - name: Install root deps (cmake-js, node-addon-api)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Configure + build native kernel (.node)
        run: npm run forge:kernel
      - name: Kernel smoke suite
        run: npm run forge:kernel:test
      - name: Coherence + logic scorer (random scenes each run)
        run: npm run forge:coherence
      - name: Native binding smoke (forge.native.* callable in-platform)
        run: node forge-kernel/test/native_binding_smoke.js
      - name: Tet4 element convergence vs Lame exact solution (observed order)
        # Hard pass/fail: the linear tetrahedron must reach its theoretical order
        # (O(h^2) displacement, O(h^1) stress) on a curved-boundary problem with a
        # closed-form answer. This is what exonerates the ELEMENT, so that the NAFEMS
        # misses below cannot be blamed on it without evidence.
        run: node forge-kernel/test/fea_tet4_convergence.mjs
      - name: NAFEMS known-answer accuracy ratchet
        # Runs fea_nafems_gate.mjs and ratchets its band misses against
        # forge-kernel/test/fea_nafems_baseline.txt. Red if the miss count OR the miss set
        # changes in either direction; red if the gate trips a kernel-correctness guard;
        # red if the result cannot be parsed. Never run the gate bare in CI -- its own exit
        # code does not cover a missed benchmark. See reports/FEA_NAFEMS_GAP.md.
        #
        # THREE axes, and BLOCKED is judged before accuracy. A case that did not run is
        # neither a pass nor a miss: LE11's ball+cone+cylinder fuse is refused on the GitHub
        # runner and succeeds on the workstation FROM THE SAME COMMIT -- measured, both are
        # macOS arm64 with the same OCCT 7.9.3, so the cause is environment-sensitivity in the
        # NATIVE boolean, not the platform, and it is not yet established (open finding).
        # Folding that into the miss count made an environment-dependent
        # kernel gap look like an accuracy change -- misses dropped 3 -> 2 here and the ratchet
        # read a CAPABILITY LOSS as an ACCURACY IMPROVEMENT, then asked for the baseline to be
        # lowered, which would have locked it in. The baseline is now a CEILING on blocked plus
        # a miss set among the cases that ran, so one committed baseline is correct on both
        # platforms. Proven by cases 11a/11b of fea_nafems_ratchet_selftest.sh, which drive the
        # two shapes against the same baseline file.
        run: bash forge-kernel/test/fea_nafems_ratchet.sh
      - name: Build forge_verify (the native verifier)
        # forge_verify is guarded by FORGE_BUILD_DESKTOP_FOUNDATION and is NOT part of the
        # .node addon build above, so it needs its own configure. Without this the batch gate
        # below cannot find a binary and exits 3 -- deliberately red, never a silent skip.
        run: |
          cmake -S forge-kernel -B forge-kernel/build-verify -DCMAKE_BUILD_TYPE=Release \
                -DFORGE_BUILD_NODE_ADDON=OFF -DFORGE_BUILD_DESKTOP_FOUNDATION=ON
          cmake --build forge-kernel/build-verify -j3 --target forge_verify
      - name: forge_verify batch survival (one bad record must not kill the batch)
        # main() calls jsonString() six times BEFORE its first try block, and jsonUnescape()
        # used std::stoi for \uXXXX. std::stoi throws on "\uZZZZ", the throw escaped main, and
        # the process died with SIGABRT taking every LATER record with it. MEASURED on the
        # gate's own 6-record fixture: before, exit=134 with 2 of 6 emitted (3 of the 4 lost
        # records were WELL-FORMED); after, exit=0 with 6 of 6. The gate also pins the quieter
        # defect the crash was hiding -- base-16 stoi stops at the first non-hex character, so
        # "\u00ZZ" partially parsed to 0 and silently injected a NUL byte.
        run: FORGE_VERIFY_BIN=forge-kernel/build-verify/forge_verify bash forge-kernel/test/forge_verify_batch_gate.sh
