name: Desktop Release (macOS arm64)

# ─────────────────────────────────────────────────────────────────────────────
# Builds the NATIVE C++ desktop app (forge_desktop) and produces a relocatable,
# self-contained Forge.app + zip. On a TAG it attaches that zip to the matching
# GitHub Release as a DRAFT. On a manual dispatch it does everything EXCEPT
# publish.
#
# This is deliberately a SEPARATE workflow from kernel-tests.yml. That file is
# the correctness gate and every job in it is hardware-calm and independent; a
# release build is a different thing with a different trigger, different
# permissions (contents: write, which the gate must NOT have) and a much heavier
# runtime. Folding it in would give the test workflow write access to releases.
#
# ── WHY THIS FILE HAS TO LIVE ON THE DEFAULT BRANCH ──────────────────────────
# `workflow_dispatch` only becomes dispatchable once the workflow file exists on
# the repository's DEFAULT branch (`archdisc`). MEASURED 2026-08-30, against the
# live API:
#
#     $ gh workflow run desktop-release.yml --ref claude/sacrosanct-execution-20260828
#     HTTP 404: workflow desktop-release.yml not found on the default branch
#
#     $ gh api repos/satvikOS/Forge/actions/workflows --jq '.workflows[].path'
#     dynamic/copilot-swe-agent/copilot
#     .github/workflows/kernel-tests.yml
#     .github/workflows/build-app.yml          (disabled_manually)
#
# desktop-release was not registered AT ALL. Note which half that broke: the TAG
# trigger resolves the workflow from the tagged commit and would have fired from
# any branch, so before this file landed on the default branch the ONLY path
# that worked was the one that PUBLISHES. The safe dry run was the one that did
# not exist. That is the wrong way round, and it is what this file fixes.
#
# A run dispatched against a ref uses the workflow definition FROM THAT REF, so
# the copy on the default branch is what makes the workflow selectable; the ref
# you pick is what actually runs and what gets built.
#
# ── WHAT A HUMAN RUNS ────────────────────────────────────────────────────────
# Nothing here fires on its own.
#
#   1. Dry run — builds, packages, measures, publishes NOTHING:
#        gh workflow run desktop-release.yml --ref <branch>
#        gh run list --workflow desktop-release.yml --limit 1
#      Read the floor / Gatekeeper table it writes to the job summary, and
#      download the artifact to test the app itself.
#
#      A dispatch CANNOT publish. That is structural, not a convention: the
#      publish step below is gated on `github.event_name == 'push'`, so there is
#      no input to set wrongly and no way to reach the release API from a
#      manual run.
#
#   2. When that is green, tag and push — THIS is the step that publishes, and
#      PUSHING THE TAG IS THE DECISION TO PUBLISH. Nothing downstream asks
#      again:
#        git tag -a v0.1.0 -m "Forge desktop v0.1.0"
#        git push origin v0.1.0
#      Use a CLEAN semver. A tag like v0.2.0-rc.1 yields a version with a '-',
#      which emit_appcast.sh puts on the "prerelease" channel and a stable
#      client refuses; the publish step rejects such a tag rather than ship a
#      release nothing can install.
#
#   3. The tag run creates the release as a draft, uploads the zip, its
#      .sha256, its report and appcast.json, and THEN flips it to
#      draft=false / prerelease=false / latest — in that order, so the release
#      only ever becomes visible already complete. A final step re-reads the
#      live API and fails the build if an installed Forge still could not see
#      it.
#
#      IT DOES NOT STOP AT A DRAFT ANY MORE, and that is a correctness fix, not
#      a relaxation. The shipped updater reads
#      releases/latest/download/appcast.json, and GitHub's `latest` skips
#      drafts AND prereleases, so a draft-only release is invisible to every
#      installed copy — silently, with every other check in this file green.
#      MEASURED 2026-08-31 by forge-desktop/test/release_visibility_check.sh:
#      the repository's only release, v0.1.0-alpha.0, was DRAFT+PRERELEASE with
#      0 assets and GET /releases/latest returned 404.
#
# ── TWO BLOCKERS A HUMAN MUST DECIDE ON BEFORE PUBLISHING ────────────────────
#   * AN OS FLOOR SET BY SOMEBODY ELSE'S BINARIES. A Homebrew bottle carries the
#     LC_BUILD_VERSION `minos` of the machine that BUILT it, and our own compile
#     flags cannot lower a floor set inside someone else's dylib. So the floor
#     follows the RUNNER IMAGE, not this source tree.
#
#     MEASURED 2026-08-30 on a macOS 26.6.2 host, from the packaged bundle:
#       floor 26.0, set by 18 of 21 bundled Mach-O files.
#       16 of those 18 are OCCT and its tbb dependency; the other two are
#       libSDL2-2.0.0.dylib and libvulkan.1.dylib, which are linked DIRECTLY
#       into forge_desktop. Dropping OCCT would therefore NOT lower the floor.
#       Our own two binaries — forge_desktop and libforge_kernel_core.dylib —
#       measured 14.0, so nothing we compile is the cause.
#     That is why this job pins `macos-15` rather than `macos-latest`: the floor
#     is a decision, and FORGE_FLOOR_MAX below turns a silent runner-image bump
#     into a RED BUILD instead of a quietly raised system requirement.
#
#     VERIFIED against the Homebrew API at the formula versions in use:
#     opencascade 7.9.3 publishes arm64_sonoma (14), arm64_sequoia (15) and
#     arm64_tahoe (26) bottles, so pinning macos-15 does not trigger a
#     from-source OCCT build that would blow the timeout.
#
#     macos-14 would give a 14.0 floor and is NOT used: those images are in
#     deprecation and stop working entirely on 2026-11-02. A release path that
#     expires in weeks is worse than one extra version of OS floor.
#
#   * GATEKEEPER REJECTS IT, AND NO CHANGE TO THIS REPOSITORY CAN FIX THAT.
#     The signature is ad-hoc: no Developer ID, no notarization.
#     MEASURED 2026-08-30: `spctl -a -vvv -t exec Forge.app` -> "rejected",
#     exit 3; `security find-identity -v -p codesigning` -> 0 valid identities.
#     A user who downloads the zip gets a refusal dialog on FIRST LAUNCH and
#     clears it ONCE, by hand, via System Settings > Privacy & Security >
#     "Open Anyway". That is a DECISION the user has taken, not a defect to be
#     fixed here. The measured steps live in docs/FIRST_LAUNCH_MACOS.md and the
#     text the release page carries lives in docs/RELEASE_BODY_macos.md.
#
#     Do NOT document "right-click > Open" anywhere. That shortcut was REMOVED
#     in macOS 15 (Sequoia), so telling a user to do it sends them somewhere
#     that does nothing.
#
#     Removing the prompt entirely needs a PAID Apple Developer ID certificate
#     plus a notarytool submission, i.e. credentials and secrets, not code.
#     Until those exist the dry run REPORTS the rejection and never asserts on
#     it: a check that cannot pass without a credential is a permanently red
#     gate, which is the same as no gate at all.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── THE KERNEL, BUILT AND CACHED ON ITS OWN ─────────────────────────────────
  # ★ THE CLAIM THIS SPLIT WAS BUILT ON WAS WRONG, AND THE CORRECTION IS THE
  # POINT. It read: "of the 452 translation units the release compiles, 421 are
  # forge_kernel_core -- 93%", and concluded the kernel was 93% of the job. 421
  # of 452 is 93% of the COUNT. A count is not a cost.
  #
  # MEASURED with a clock, run 33392163311, macos-15, -j3, warm ccache:
  #     kernel configure          2.4s
  #     forge_kernel_core       121.5s   <- 82.6% of the build, not 93%
  #     desktop configure         1.0s
  #     forge_desktop + gate     17.1s   <- 31 TUs, 6.9% of the count, 11.6%
  #     frame gate                0.3s
  #     package (sign, verify)    4.7s
  #     ---------------------------------
  #     TOTAL                     147 SECONDS
  #
  # The build was never near the ceiling. That same run was killed at 180.3
  # minutes because ONE app launch inside package_macos.sh hung for 176.5 of
  # them; see the note on `timeout-minutes` in the release job. The earlier
  # "died a few TUs from done" reading came from a run that predates the target
  # trim and does not describe this pipeline.
  #
  # This job is kept, with its purpose corrected: it exists to WARM ccache, not
  # to cache a build tree. The build-tree cache it used to write is gone --
  # measured useless, see the note on the cache step below.
  #
  # ── WHAT IS AND IS NOT PROVEN ABOUT THE SHARING ─────────────────────────────
  # PROVEN (run 33441755519): this job now SAVES, which it never did before --
  # `Cache saved with key: ccache-forge-macOS-kernel-f460e353...`, where every
  # prior run logged a Path Validation warning and saved nothing.
  #
  # PROVEN: the release job's build fell from 168s to 22s with ccache reporting
  # `Hits: 454/454 (100.0%)`. That came from the release job restoring ITS OWN
  # previous cache, which the ordered restore-keys now prefer.
  #
  # NOT PROVEN, and deliberately not claimed: that this job's cache is USABLE by
  # the release job. In the same run this job restored the release job's cache
  # through the shared prefix and still measured `Hits: 0/422 (0.00%)`, so
  # objects compiled by one job did not hit for the other. The cause is not yet
  # identified. Cross-job reuse is therefore an OPEN QUESTION, not a benefit
  # this file may assume; the first run after a kernel-source-only change is the
  # experiment that would settle it.
  #
  # Note the real constraint that DID justify a separate job: actions/cache saves
  # in a POST step, and on a cancelled run "Post Restore compiler cache" is
  # recorded as SKIPPED. A cache written only by a job that never finishes is not
  # a cache. That is still true, and is why the warming lives here.
  kernel:
    name: build + cache forge_kernel_core (macOS arm64)
    runs-on: macos-15
    # 20, for the reason spelled out on the release job's own timeout: a ceiling
    # is the blast radius of a hang, not a build budget. MEASURED whole-job wall
    # clock for THIS job: 3.68 min cold (run 33440617438), 1.75 min warm (run
    # 33442901972). 20 is 5.4x the cold number. Lower than the release job's 25
    # because this job does strictly less: no packaging, no app launch, no zip.
    timeout-minutes: 20
    env:
      # MUST match the release job's FORGE_MACOS_MIN exactly. A different deployment
      # target makes CMake reconfigure and rebuild the whole tree, so the cache would
      # be restored and then thrown away -- a cache that silently does nothing is
      # worse than none, because the build looks correct and stays slow.
      FORGE_MACOS_MIN: "14.0"
      # ★ WITHOUT THIS LINE THIS ENTIRE JOB WAS A NO-OP, and said nothing about it.
      # The cache step below archives /Users/runner/.ccache, but CCACHE_DIR was set
      # only in the RELEASE job, so ccache here wrote to its macOS default
      # (~/Library/Caches/ccache) and the post-save step reported:
      #
      #   Path Validation Error: Path(s) specified in the action for caching
      #   do(es) not exist, hence no cache is being saved.
      #
      # -- a WARNING, on a job that stays green. MEASURED in run 33440617438: this
      # job compiled 422/422 objects with 0 hits, took 3.7 minutes, saved nothing,
      # and the release job then reported `Cache not found for input keys:
      # ccache-forge-macOS-...` and paid for all 422 again. It had never once
      # worked, under this key or the disjoint one before it.
      #
      # A path that does not exist is a WARNING and not an error, which is exactly
      # how a job spends four minutes per run producing nothing and still looks
      # like it is doing its job.
      CCACHE_DIR: /Users/runner/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew update >/dev/null || true
          brew install opencascade boost cmake ccache

      - name: Point the dependency plane at the Homebrew prefixes
        shell: bash
        run: |
          set -euo pipefail
          echo "OCCT_VERSION=$(brew list --versions opencascade | awk '{print $2}')" >> "$GITHUB_ENV"
          for f in opencascade boost; do
            key="FORGE_DEPS_PREFIX_$(echo "$f" | tr '[:lower:]-' '[:upper:]_')"
            prefix="$(brew --prefix "$f")"
            test -d "$prefix" || { echo "::error::brew --prefix $f -> $prefix missing"; exit 1; }
            echo "$key=$prefix" >> "$GITHUB_ENV"
          done

      # ── THE BUILD-TREE CACHE IS GONE. IT MEASURABLY BOUGHT NOTHING. ─────────
      # It cached `forge-kernel/build-app` on a key over the kernel sources, and
      # in run 33392163311 it worked exactly as designed: the desktop job logged
      # `Cache restored successfully` at 12:36:38, in 2 seconds.
      #
      # Then release_dryrun.sh recompiled all 421 kernel translation units
      # anyway, from 12:36:43 to 12:38:44 — 121.5 seconds — with byte-identical
      # configure flags (verified against release_dryrun.sh:90-94, so CMake did
      # not reconfigure; the 2.4s configure confirms the CMakeCache was reused).
      #
      # THE CACHE WAS NOT TRUNCATED, WHICH IS THE INTERESTING PART. 6 MB looks far
      # too small for 421 objects plus a linked dylib, and "the cache is a
      # phantom" was the first theory. It is wrong: a complete tree measures
      # 109 MB uncompressed but only 11 MB of that is objects (these TUs are
      # thin) and 6.4 MB is the dylib, and `tar | zstd -3` -- what actions/cache
      # uses -- brings a VERIFIED-complete local tree to 7.0 MB. 6 MB is a whole
      # tree. So the rebuild cannot be blamed on missing files.
      #
      # The mechanism is `actions/checkout`. The consuming job checks the SOURCES
      # out fresh, stamping every file with the checkout time (12:35:23-31),
      # which is NEWER than the cached object files the producing job compiled at
      # 12:32-12:35. Make compares mtimes, sees every source as newer than its
      # object, and rebuilds the lot. A build-tree cache cannot survive a
      # checkout in a different job, and no key is narrow or wide enough to fix
      # that.
      #
      # Restoring mtimes to beat the comparison was considered and rejected: on a
      # RELEASE path, teaching make to trust an object that a source may really
      # have outrun risks shipping a stale binary. The file's own warning already
      # said a partial tree "is worse than none, because make would trust stale
      # objects" — that hazard is real and this removes it.
      #
      # ccache replaces it properly, because ccache is CONTENT-addressed: it
      # hashes the preprocessed source and the compiler flags, and does not care
      # what mtime a checkout wrote.
      #
      # ── ONE ccache NAMESPACE ACROSS BOTH JOBS ───────────────────────────────
      # These two jobs used DISJOINT prefixes: `ccache-kernel-*` here and
      # `ccache-desktop-*` in the release job. So this job compiled 422 objects
      # (`Misses: 422/422 (100.0%)`) into a cache the other job could not name,
      # and the release job restored `ccache-desktop-...` instead and paid for
      # the same 421 compilations a second time. The kernel job existed to save
      # the release job that work and, because of the prefix, saved it none.
      #
      # One shared prefix fixes it. `needs: kernel` makes the jobs serial, so
      # this job's post-save has completed before the release job restores, and
      # its restore-keys prefix match picks up this cache.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-forge-${{ runner.os }}-kernel-${{ hashFiles('forge-kernel/src/**', 'forge-kernel/include/**') }}
          # Ordered: this job's own namespace first, the shared prefix second.
          # restore-keys are tried IN ORDER, and within one prefix the most
          # recently created match wins -- so without the specific line first, a
          # job would happily restore the OTHER job's cache in preference to its
          # own more relevant one.
          restore-keys: |
            ccache-forge-${{ runner.os }}-kernel-
            ccache-forge-${{ runner.os }}-

      - name: Build forge_kernel_core
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -euo pipefail
          ccache --max-size=3G --zero-stats
          cmake -S forge-kernel -B forge-kernel/build-app \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_DEPLOYMENT_TARGET="$FORGE_MACOS_MIN" \
                -DFORGE_BUILD_NODE_ADDON=OFF \
                -DFORGE_BUILD_DESKTOP_FOUNDATION=ON
          cmake --build forge-kernel/build-app -j3 --target forge_kernel_core
          ccache --show-stats

      - name: Prove the kernel library exists
        # This job's whole output is a warm ccache, which is invisible: a ccache that
        # silently cached nothing looks exactly like one that worked, and the release
        # job would just pay full price without anyone noticing. Linking the library
        # is the observable that proves the compilations really happened here.
        run: |
          set -euo pipefail
          find forge-kernel/build-app -name 'libforge_kernel_core*' -print | head -5
          test -n "$(find forge-kernel/build-app -name 'libforge_kernel_core*' -print -quit)" \
            || { echo "::error::no libforge_kernel_core in the build tree"; exit 1; }

  macos-arm64:
    needs: kernel
    name: build + package Forge.app (macOS arm64)
    runs-on: macos-15
    # ★ 180 IS NOT A BUILD BUDGET. THE BUILD NEEDS 147 SECONDS.
    #
    # A JOB TIMEOUT AND A CONCURRENCY CANCEL BOTH REPORT AS `cancelled`. Two runs
    # were read as infrastructure blips before anyone did the subtraction:
    #
    #   run 33392163311  job 12:35:22Z -> 15:35:40Z = 180.3 min
    #   run 33377699374  job 09:26:50Z -> 12:27:08Z = 180.3 min
    #
    # 180.3 against `timeout-minutes: 180` is the ceiling, exactly. It was NOT a
    # concurrency cancel: `cancel-in-progress` is false above, and `gh run list`
    # shows no newer run on this ref at either kill time. Not a manual cancel
    # either — one would land at an arbitrary time, not twice at 180.3.
    #
    # WHERE THE 180 MINUTES WENT, from the run log:
    #   12:36:40 -> 12:39:07   the ENTIRE build and package        147 s
    #   12:39:07 -> 15:35:35   one hung app launch           176.5 min
    #
    # The last line printed was `[package] relocation smoke test: launching the
    # COPY`, and at cleanup the runner logged `Terminate orphan process: pid
    # (10831) (forge_desktop)`. package_macos.sh launched the bundled app to
    # prove the bundle is relocatable and the process never exited; macOS ships
    # no `timeout(1)`, so nothing bounded it. That launch is now bounded at 120s
    # and takes a `sample(1)` stack on expiry — see run_bounded in
    # forge-desktop/package_macos.sh.
    #
    # SO: DO NOT RAISE THIS NUMBER. It has never been the constraint. If a run
    # approaches it again, something is STUCK, and release_dryrun.sh now prints a
    # per-phase timing table that says which phase. Read the table first.
    #
    # ── AND IT COMES BACK DOWN, BECAUSE 180 WAS ITSELF A GUESS ───────────────
    # The 180 was not a budget anybody measured. It replaced a 90 that "was
    # never exercised", raised while the cause was still unknown — and the cause
    # turned out to be a hang, which a bigger ceiling only makes more expensive.
    # A timeout is not a build budget; it is the BLAST RADIUS OF A HANG. At 180
    # the next stuck process costs three hours before anyone hears about it.
    #
    # MEASURED job wall clocks with the hang fixed, whole job, not just the
    # build step:
    #   run 33440617438  release job  4.45 min   ccache 453/454 MISSES (cold)
    #   run 33440617438  kernel  job  3.68 min   cold
    #   run 33442901972  release job  1.85 min   ccache 454/454 hits (warm)
    #   run 33442901972  kernel  job  1.75 min   warm
    # The cold number is the real one and it is under five minutes. 25 gives 5.6x
    # headroom over the worst of those, absorbs a slow `brew install` (measured
    # 62 s) and a cold ccache at once, and still bounds a new hang to 25 minutes
    # instead of three hours.
    #
    # This is a ceiling, not a target: it does not make anything faster, and it
    # must never be raised to make a red run green. If a legitimate run ever
    # needs more than this, the phase table will say which phase grew, and THAT
    # is what gets fixed.
    timeout-minutes: 25
    env:
      # The floor this artifact is ALLOWED to have. macos-15 bottles are
      # arm64_sequoia, which measure 15.0. The build FAILS if the measured floor
      # exceeds this, so a runner-image change can never quietly raise the
      # minimum macOS of a shipped artifact. Raise it only as a reviewed
      # decision to ship a higher minimum.
      FORGE_FLOOR_MAX: "15.0"
      # What OUR code compiles against, so our own binaries never set the floor.
      FORGE_MACOS_MIN: "14.0"
      CCACHE_DIR: /Users/runner/.ccache
    permissions:
      # Needed ONLY by the final step, to attach the zip to a release on a tag.
      # The build itself reads nothing privileged.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — does this ref carry the desktop release path?
        # This file lives on the default branch so the workflow can be
        # dispatched at all, but the default branch does not necessarily carry
        # the desktop SOURCES. Without this step, dispatching against such a ref
        # dies 40 minutes later inside CMake with an error about a missing
        # library, which reads like a build regression rather than "you picked a
        # ref that has no app in it". Fail in ten seconds, and say which ref.
        shell: bash
        run: |
          set -uo pipefail
          missing=0
          for f in forge-kernel/CMakeLists.txt \
                   forge-desktop/CMakeLists.txt \
                   forge-desktop/package_macos.sh \
                   forge-desktop/release_dryrun.sh \
                   docs/RELEASE_BODY_macos.md; do
            if [ -f "$f" ]; then printf 'ok       %s\n' "$f"
            else printf 'MISSING  %s\n' "$f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::ref '${GITHUB_REF_NAME}' does not carry the desktop" \
                 "release path (files marked MISSING above). Dispatch this" \
                 "workflow against a ref that contains forge-desktop/src, or" \
                 "merge that branch into the default branch first. Nothing was" \
                 "built and nothing was published."
            exit 1
          fi
          echo "preflight OK on ref '${GITHUB_REF_NAME}'"

      - name: Assert the runner is what the artifact claims to be
        # The zip is NAMED Forge-macos-arm64-*. Nothing else proves it. GitHub
        # has changed macOS label routing before, and an x86_64 runner here
        # would silently produce an Intel binary inside a file called "arm64",
        # with an OS floor from the wrong bottle set. Make that a red build.
        shell: bash
        run: |
          set -uo pipefail
          ARCH="$(uname -m)"
          echo "runner arch: $ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::runner is $ARCH, not arm64; this job builds an" \
                 "arm64-named artifact. Check the runs-on label routing."
            exit 1
          fi

      - name: Install build dependencies
        # opencascade pulls tbb; sdl2 is an ALIAS for sdl2-compat on current
        # Homebrew, which is why the CMake dependency probe verifies that
        # `brew --prefix <formula>` actually EXISTS and falls back to the opt
        # keg link. Do not "simplify" that probe.
        run: |
          brew update-reset >/dev/null 2>&1 || true
          # boost is required by forge-kernel's ForgeDeps resolver (CMakeLists.txt:1188):
          # planegcs uses boost::graph and boost::math::constants. Two dispatched dry runs
          # failed on `could not resolve 'boost' 1.90.0` before this landed.
          #
          # THIS FIX HAS TO BE ON THIS BRANCH, not only on the default one. A run
          # dispatched against a ref uses the workflow definition FROM THAT REF -- the copy
          # on the default branch only makes the workflow SELECTABLE. The second dry run
          # failed identically to the first because the fix had been merged to archdisc
          # while the run was dispatched against this branch.
          brew install opencascade boost sdl2 vulkan-headers vulkan-loader molten-vk glslang cmake ccache

      - name: Point the dependency plane at the Homebrew prefixes
        # WHY THE RELEASE BUILD COULD NOT CONFIGURE. forge-kernel resolves
        # opencascade and boost through the pinned dependency plane
        # (cmake/ForgeDeps.cmake, Sacrosanct 3.1 s10.6), which REFUSES a
        # machine-global prefix it was not told about:
        #
        #   This build is NOT reproducible on a clean machine — the prefix is not
        #   part of the pinned local dependency plane.
        #   Fix: seed and activate the local mirror, or pass
        #        -DFORGE_DEPS_PREFIX_OPENCASCADE=<prefix>
        #
        # That refusal is CORRECT — it is what stops a release being built against
        # whatever happened to be on one machine. The runner is not a clean machine
        # either, so the honest fix is to NAME the prefixes rather than silence the
        # check: ForgeDeps accepts FORGE_DEPS_PREFIX_<NAME> from the environment,
        # so the versions recorded by the step below are exactly the ones used.
        #
        # Every release run before this one failed here, which is why no release
        # has ever carried a binary.
        shell: bash
        run: |
          set -euo pipefail
          # The OCCT version goes into the kernel-build cache key: a build tree linked
          # against a different OpenCascade must not be restored.
          echo "OCCT_VERSION=$(brew list --versions opencascade | awk '{print $2}')" >> "$GITHUB_ENV"
          for f in opencascade boost; do
            key="FORGE_DEPS_PREFIX_$(echo "$f" | tr '[:lower:]-' '[:upper:]_')"
            prefix="$(brew --prefix "$f")"
            test -d "$prefix" || { echo "::error::brew --prefix $f -> $prefix does not exist"; exit 1; }
            echo "$key=$prefix" >> "$GITHUB_ENV"
            echo "$key=$prefix"
          done

      - name: Record the toolchain that produced this artifact
        # An artifact whose provenance is not written down cannot be debugged
        # later. These versions decide the OS floor and the geometry.
        run: |
          sw_vers
          uname -m
          cmake --version | head -1
          for f in opencascade sdl2 molten-vk vulkan-loader tbb; do
            printf '%-16s %s\n' "$f" "$(brew list --versions "$f" || echo MISSING)"
          done

      # The build-tree cache that used to sit here has been REMOVED. See the long
      # note in the `kernel` job above: it restored perfectly (2s) and then the
      # kernel recompiled all 421 TUs anyway (121.5s), because actions/checkout
      # gives every source a newer mtime than the cached objects. It cost a cache
      # slot and bought zero seconds. ccache does this job properly: with the
      # ordered restore-keys below this step restored its own previous cache and
      # measured `Hits: 454/454 (100.0%)`, taking the build from 168s to 22s
      # (run 33441755519). Whether the KERNEL job's cache is also usable here is
      # unproven -- see "WHAT IS AND IS NOT PROVEN" in that job above.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-forge-${{ runner.os }}-desktop-${{ hashFiles('forge-kernel/src/**', 'forge-kernel/include/**', 'forge-desktop/src/**', 'ui/src/**') }}
          # Own namespace first (it holds kernel AND desktop objects), then the
          # kernel job's as a fallback for the first run after a desktop edit.
          restore-keys: |
            ccache-forge-${{ runner.os }}-desktop-
            ccache-forge-${{ runner.os }}-

      - name: Derive the version
        id: ver
        # A tag is v0.1.0; CFBundleShortVersionString must be 0.1.0. A manual
        # dispatch has no tag, so it is stamped with the short sha to make an
        # unreleasable build obviously unreleasable.
        shell: bash
        run: |
          set -uo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-dev+${GITHUB_SHA:0:7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Packaging version $V"

      - name: Build, package, and report the floor + Gatekeeper verdict
        # ONE script, run identically here and on a developer's machine, so the
        # CI report and the local report cannot drift. It builds both CMake
        # projects, runs the headless frame gate, packages Forge.app, then
        # MEASURES the OS floor and the spctl verdict and writes them to the job
        # summary and to a JSON report next to the zip.
        #
        # It publishes nothing: it creates no tag and never calls the release
        # API. Publishing is the separate, tag-gated step at the bottom.
        #
        # --floor-max is the hard gate. Verified to fire in BOTH directions
        # (measured floor 26.0 against --floor-max 15.0 exits 1; against 26.0
        # exits 0), so it is a real check and not a decorative one.
        #
        # ccache is wired through the ENVIRONMENT rather than -D flags because
        # CMake initialises CMAKE_<LANG>_COMPILER_LAUNCHER from the identically
        # named environment variable; verified honoured before being relied on.
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -uo pipefail
          ccache --max-size=3G --zero-stats
          bash forge-desktop/release_dryrun.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --macos-min "$FORGE_MACOS_MIN" \
            --floor-max "$FORGE_FLOOR_MAX" \
            --jobs 3
          ccache --show-stats

      - name: Prove the artifact exists and is self-contained
        # Belt and braces over the script's own checks: a packaging step that
        # exits 0 having produced nothing is exactly the failure mode this
        # programme keeps hitting.
        shell: bash
        run: |
          set -uo pipefail
          V="${{ steps.ver.outputs.version }}"
          ZIP="forge-desktop/dist/Forge-macos-arm64-${V}.zip"
          REPORT="forge-desktop/dist/Forge-macos-arm64-${V}.dryrun.json"
          test -f "$ZIP"    || { echo "::error::no zip at $ZIP"; exit 1; }
          test -f "$REPORT" || { echo "::error::no report at $REPORT"; exit 1; }
          test -x forge-desktop/dist/Forge.app/Contents/MacOS/forge_desktop || {
            echo "::error::no executable inside the bundle"; exit 1; }
          ls -la forge-desktop/dist/
          echo "--- executable link closure ---"
          otool -L forge-desktop/dist/Forge.app/Contents/MacOS/forge_desktop
          echo "--- the binary really is arm64 ---"
          # Last chance to catch a runner that routed to Intel: every step
          # upstream would still be green.
          lipo -archs forge-desktop/dist/Forge.app/Contents/MacOS/forge_desktop > /tmp/archs
          cat /tmp/archs
          grep -qw arm64 /tmp/archs || { echo "::error::executable is not arm64"; exit 1; }
          echo "--- report ---"
          cat "$REPORT"

      - name: Render the release notes (EVERY run, tag or not)
        # The rendering used to happen only inside the publish step, which is
        # tag-gated. That put the notes on the half of the path a human cannot
        # rehearse: a broken body would first be discovered by the run that
        # PUBLISHES. Same shape of mistake as this workflow's own history, where
        # the only trigger that worked was the one that published.
        #
        # So the body is rendered HERE, on a dispatch too, from the same source
        # and with the same measured values. The publish step below does not
        # re-render; it uploads THESE bytes, so what a dry run shows is exactly
        # what a tag would publish.
        id: notes
        shell: bash
        env:
          # A tag run has the real tag. A dispatch has none, so the version
          # string is used, which already carries the short sha and makes an
          # unreleasable build obviously unreleasable.
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          REPORT="forge-desktop/dist/Forge-macos-arm64-${V}.dryrun.json"
          ZIP="forge-desktop/dist/Forge-macos-arm64-${V}.zip"
          BODY_SRC="docs/RELEASE_BODY_macos.md"
          test -f "$BODY_SRC" || { echo "::error::$BODY_SRC missing"; exit 1; }

          FLOOR="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["measured_floor"])' "$REPORT")"
          SHA="$(awk '{print $1}' "$ZIP.sha256")"
          OUT="forge-desktop/dist/Forge-macos-arm64-${V}.notes.md"

          # Drop the leading HTML comment block (authoring instructions for
          # whoever edits the body), then substitute the MEASURED values. A
          # hard-coded minimum macOS or sha256 is wrong the moment the runner
          # image or the build moves.
          sed '/^<!--$/,/^-->$/d' "$BODY_SRC" \
            | sed -e "s|@@REPO_URL@@|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|g" \
                  -e "s|@@TAG@@|${TAG_NAME}|g" \
                  -e "s|@@VERSION@@|${V}|g" \
                  -e "s|@@FLOOR@@|${FLOOR}|g" \
                  -e "s|@@SHA@@|${SHA}|g" > "$OUT"

          # An unsubstituted placeholder would publish a literal "@@SHA@@" to
          # users. Deliberately `grep -q` inside an `if` and NOT
          # `LEFT=$(grep -c ...)`: this step runs under `set -e`, grep exits 1
          # when it finds nothing, and an assignment carries its substitution's
          # status, so counting would abort the step on the SUCCESS path.
          if grep -q '@@[A-Z_]*@@' "$OUT"; then
            grep -n '@@[A-Z_]*@@' "$OUT" >&2
            echo "::error::unsubstituted placeholder(s) in the release body"
            exit 1
          fi
          test -s "$OUT" || { echo "::error::release body rendered empty"; exit 1; }

          # The one instruction that must never come back. Apple REMOVED the
          # Control-click override in macOS 15 (Sequoia), so shipping it sends
          # users to a menu item that does not exist. The second grep lets the
          # body keep its explicit "ignore anything that says right-click"
          # warning while still failing on a line that TELLS them to do it.
          #
          # The result is captured into a variable rather than read from the
          # pipeline's status: `grep -q` exits on its FIRST match and closes the
          # pipe, which can SIGPIPE the upstream grep, and under `pipefail` that
          # non-zero status would read as "clean" and silently disable the
          # guard. Neither grep here is -q, both read to EOF, and the decision
          # is made on the TEXT.
          BAD="$(grep -iE 'right[ -]click|control[ -]click' "$OUT" \
                 | grep -ivE 'ignore|removed|do not|does nothing|no longer' \
                 || true)"
          if [ -n "$BAD" ]; then
            printf '%s\n' "$BAD" >&2
            echo "::error::the release body tells users to right-click to Open;" \
                 "that shortcut was REMOVED in macOS 15 (Sequoia)"
            exit 1
          fi

          echo "notes=$OUT" >> "$GITHUB_OUTPUT"
          echo "--- release notes that a tag would publish VERBATIM ---"
          cat "$OUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Release notes this build would publish"
              echo
              cat "$OUT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload as a CI artifact (always)
        # Every run keeps its build, tag or not, so a dry run is downloadable
        # and testable WITHOUT touching a release.
        uses: actions/upload-artifact@v4
        with:
          name: Forge-macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            forge-desktop/dist/Forge-macos-arm64-*.zip
            forge-desktop/dist/Forge-macos-arm64-*.zip.sha256
            forge-desktop/dist/Forge-macos-arm64-*.dryrun.json
            forge-desktop/dist/Forge-macos-arm64-*.notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release (pushed tags ONLY)
        # The condition is deliberately BOTH halves. `ref_type == 'tag'` alone
        # would still let a manual dispatch against a tag ref reach the release
        # API; requiring event_name == 'push' means a dispatch structurally
        # cannot publish, which is what makes the dry run above safe by
        # construction rather than by remembering to set a flag.
        #
        # ── WHY THIS NO LONGER STOPS AT A DRAFT ──────────────────────────────
        # It used to create the release as a draft and stop, on the reasoning
        # that publishing asserts the artifact is fit to download and the
        # Gatekeeper blocker in the header makes that a human's call. That
        # reasoning had a consequence nobody had measured, and
        # forge-desktop/emit_appcast.sh states the mechanism in its own header:
        # the shipped updater fetches ONE fixed URL,
        #
        #     https://github.com/<repo>/releases/latest/download/appcast.json
        #
        # and GitHub resolves `latest` to the newest release that is NEITHER A
        # DRAFT NOR A PRERELEASE. A draft-only release therefore 404s that URL.
        #
        # MEASURED 2026-08-31, before this change, by
        # forge-desktop/test/release_visibility_check.sh:
        #     1 release(s) exist
        #       v0.1.0-alpha.0   DRAFT,PRERELEASE   assets=0
        #     FAIL  GET /releases/latest returned nothing
        # So "stop at a draft" is not a safe default that a human later lifts.
        # It is a shipped artifact no installed copy of Forge can ever see, and
        # every other check in this file passes on it exactly as it does on a
        # published one. The human decision the draft was protecting is now
        # taken UPSTREAM, by whoever pushes the tag: a tag push IS the act of
        # publishing, and it is the only way to reach this step at all.
        #
        # ── ORDER MATTERS, AND IT IS DRAFT-FIRST-THEN-FLIP ───────────────────
        # Creating the release visible and then uploading would leave a window
        # in which `releases/latest` resolves to a release with NO appcast.json
        # and NO zip; a client that polled inside that window would read a 404
        # for the payload it had just been told about. So: create as a draft
        # (invisible), upload every asset, and only then flip draft=false. The
        # release becomes visible already complete.
        #
        # An EXISTING draft is flipped too. Leaving one alone, which is what the
        # previous version did, is exactly how v0.1.0-alpha.0 sat invisible.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="${{ steps.ver.outputs.version }}"
          ZIP="forge-desktop/dist/Forge-macos-arm64-${V}.zip"
          REPORT="forge-desktop/dist/Forge-macos-arm64-${V}.dryrun.json"

          # NOT re-rendered here. The "Render the release notes" step above
          # already produced these exact bytes and printed them, on a dispatch
          # too, so a dry run rehearses the publish instead of the publish being
          # the first place the notes are ever built.
          NOTES="${{ steps.notes.outputs.notes }}"
          test -s "$NOTES" || { echo "::error::no rendered notes at $NOTES"; exit 1; }

          # A version carrying a prerelease suffix goes out on the "prerelease"
          # channel — emit_appcast.sh keys the channel off a '-' in the version
          # — and a stable client refuses a foreign channel. Publishing such a
          # build as `latest` would advertise it to clients that will then
          # refuse it, which looks identical to a broken updater. Catch it here
          # rather than shipping a release nothing can install.
          case "$V" in
            *-*) echo "::error::tag $TAG yields version '$V', which"          \
                      "emit_appcast.sh puts on the PRERELEASE channel; a"     \
                      "stable client refuses it. Tag a clean semver."; exit 1 ;;
          esac

          # ── 1. create as a DRAFT, or reuse whatever is already there ───────
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG yet - creating it (draft, for now)"
            gh release create "$TAG" --draft --title "Forge $TAG" \
              --notes-file "$NOTES"
          else
            echo "release $TAG already exists - reusing it"
          fi

          # ── 2. upload every asset WHILE IT IS STILL INVISIBLE ──────────────
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" "$REPORT" --clobber
          gh release upload "$TAG" "forge-desktop/dist/appcast.json" --clobber

          # ── 3. flip it visible, complete, in one call ──────────────────────
          # --latest is explicit: `latest` is what the updater's URL resolves
          # through, and leaving it to GitHub's own ordering is a silent
          # dependency on tag sort order.
          gh release edit "$TAG" --draft=false --prerelease=false --latest

          echo "published $TAG with $ZIP and appcast.json"

      - name: Prove an installed Forge can actually SEE this release
        # The step above can succeed in every observable way and still ship
        # something invisible: a release that stayed a draft, or is marked
        # prerelease, or is published with no appcast.json attached, breaks the
        # updater silently and nothing else in this repository would notice.
        # This asks the one question the other checks cannot — given what is
        # published RIGHT NOW, would an installed Forge find it? — against the
        # live API, after the fact, rather than against our intention.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          V="${{ steps.ver.outputs.version }}"
          # Bounded retry, and it is NOT a softened assertion. GET
          # /releases/latest is served from a cache that can lag the edit above
          # by a few seconds, so a single immediate probe can read a 404 for a
          # release that is already correct. The VERDICT is unchanged -- the
          # last attempt decides, and the step fails if it fails. Five tries,
          # ten seconds apart, is 50 s against a build that measures under five
          # minutes; if it is still invisible after that, it is invisible.
          for attempt in 1 2 3 4 5; do
            echo "--- visibility attempt $attempt of 5 ---"
            if bash forge-desktop/test/release_visibility_check.sh \
                 --expect-version "$V"; then
              echo "an installed Forge can see $V"
              exit 0
            fi
            [ "$attempt" -lt 5 ] && sleep 10
          done
          echo "::error::the release published above is NOT visible to an" \
               "installed Forge after 5 attempts over 50s. It is a draft, a" \
               "prerelease, or missing appcast.json/the zip. See the listing" \
               "printed above for which."
          exit 1
