name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - master
      - claude/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g serverless@3
          cd backend && npm install --production

      - name: Verify setup
        run: |
          echo "✓ Serverless version: $(serverless --version)"
          echo "✓ Node version: $(node --version)"
          echo "✓ Backend dependencies installed"
          ls -la backend/node_modules | head -5
          echo ""
          echo "🔍 Checking critical file updates:"
          echo "   bedrockService.js modified: $(stat -c %y backend/services/bedrockService.js)"
          echo "   Checking for JSON parsing fix..."
          if grep -q "Found markdown code block, extracting JSON" backend/services/bedrockService.js; then
            echo "   ✅ JSON parsing fix is present in source"
          else
            echo "   ❌ WARNING: JSON parsing fix NOT found in source!"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS Lambda
        run: |
          echo "🚀 Starting deployment..."
          echo "📋 Deployment configuration:"
          echo "   Stage: dev"
          echo "   Region: us-east-1"
          echo "   Force: true"
          echo ""
          serverless deploy --stage dev --verbose --force 2>&1 | tee deploy.log
          echo ""
          echo "📊 Deployment completed, checking artifacts..."
          if [ -f .serverless/archdisc-cad.zip ]; then
            echo "   Package size: $(du -h .serverless/archdisc-cad.zip | cut -f1)"
            echo "   Checking package contents..."
            unzip -l .serverless/archdisc-cad.zip | grep "bedrockService.js" || echo "   ⚠️ bedrockService.js not found in package!"
          fi
        env:
          SLS_TELEMETRY_DISABLED: 1
          SLS_DEPRECATION_DISABLE: '*'
          SERVERLESS_ACCESS_KEY: ''

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          echo "   Waiting for Lambda to update..."
          sleep 15
          echo ""
          echo "📡 Testing API endpoint..."
          RESPONSE=$(curl -s https://qmgj3s9wse.execute-api.us-east-1.amazonaws.com/dev/api/test || echo '{"error":"failed"}')
          echo "   Response: $RESPONSE"
          echo ""
          VERSION=$(echo $RESPONSE | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          echo "   Deployed version: $VERSION"
          echo "   Expected version: 2.1.0-json-fix"
          echo ""
          if [[ "$VERSION" == "2.1.0-json-fix" ]]; then
            echo "✅ Verification SUCCESSFUL - New code is deployed!"
            echo "   The JSON parsing fix is now live!"
          else
            echo "❌ Verification FAILED"
            echo "   Lambda may still be running old code"
            echo "   This could indicate a Lambda caching or versioning issue"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Deployed Lambda functions:"
          echo "   - archdisc-cad-dev-api (with JSON parsing fix)"
          echo "   - archdisc-cad-dev-orchestrate"
          echo ""
          echo "🔧 Updates included:"
          echo "   - Fixed JSON parsing for markdown code blocks"
          echo "   - AI-only geometry generation"
          echo "   - Enhanced AXEL engine with 5-step pipeline"
