name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - master
      - claude/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g serverless@3
          cd backend && npm install --production

      - name: Verify setup
        run: |
          echo "✓ Serverless version: $(serverless --version)"
          echo "✓ Node version: $(node --version)"
          echo "✓ Backend dependencies installed"
          ls -la backend/node_modules | head -5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS Lambda
        run: |
          echo "🚀 Starting deployment..."
          serverless deploy --stage dev --verbose --force
        env:
          SLS_TELEMETRY_DISABLED: 1
          SLS_DEPRECATION_DISABLE: '*'
          SERVERLESS_ACCESS_KEY: ''

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10
          RESPONSE=$(curl -s https://qmgj3s9wse.execute-api.us-east-1.amazonaws.com/dev/api/test)
          echo "API Response: $RESPONSE"
          VERSION=$(echo $RESPONSE | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          echo "Deployed version: $VERSION"
          if [[ "$VERSION" == "2.1.0-json-fix" ]]; then
            echo "✅ Verification successful - new code is deployed!"
          else
            echo "⚠️ Warning: API may not have updated correctly"
            echo "Expected: 2.1.0-json-fix"
            echo "Got: $VERSION"
          fi

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Deployed Lambda functions:"
          echo "   - archdisc-cad-dev-api (with JSON parsing fix)"
          echo "   - archdisc-cad-dev-orchestrate"
          echo ""
          echo "🔧 Updates included:"
          echo "   - Fixed JSON parsing for markdown code blocks"
          echo "   - AI-only geometry generation"
          echo "   - Enhanced AXEL engine with 5-step pipeline"
