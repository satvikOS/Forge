name: Gate registration

# IS EVERY forge-desktop GATE ACTUALLY WIRED IN?
#
# WHAT THIS DOES **NOT** CLAIM. It does not compile forge-desktop and it does not
# run a single gate. The `desktop` job in kernel-tests.yml already does both, on
# every pull request, and it was MEASURED doing so: run 33694445319, job
# 100460336054, step 8 "Compile forge-desktop" success in 30 s, step 9 "gates +
# mutation proofs" success in 159 s, ending "[ci-desktop] GREEN — verdict
# confirmed: [desktop] ALL FORGE DESKTOP GATES PASS, and all 41 mutations proved
# red-then-green". Anyone who believes forge-desktop is uncompiled in CI should
# read that job before writing another one.
#
# THE SEAM THIS DOES CLOSE, and it is narrow on purpose. run_desktop.sh chooses
# what to execute from a HARDCODED list of `run_gate <target> <mutations...>`
# lines. forge-desktop/CMakeLists.txt chooses what to BUILD. Nothing compared
# the two. The gap between them is asymmetric, and only one half was already
# covered — measured, both directions, before this workflow was written:
#
#   REMOVING an existing gate's run_gate line  -> TOTAL_MUTATIONS falls 40 -> 32,
#       which no longer equals the EXPECTED_MUTATIONS=40 that ci_desktop_gate.sh
#       pins, so that job already goes red. ALREADY COVERED; this adds nothing.
#
#   ADDING a new gate target and forgetting its run_gate line -> TOTAL_MUTATIONS
#       stays 40, the pin still matches, ci_desktop_gate.sh stays GREEN, and
#       run_syntax_gate.sh is satisfied the moment the new .cpp is added to its
#       CHECKED array — where it is only -fsyntax-only'd, never run. NOTHING in
#       the repository caught this. That is the case this workflow exists for.
#
# It is the live shape, not a hypothetical: a gate written to keep developer
# prose out of a panel can be compiled, syntax-checked, committed, and never
# executed once, with every check green.
#
# ui/test needs no equivalent: run_ui.sh:60 is `TESTS=(ui/test/*_test.cpp)`, a
# glob, so a new test there is picked up by construction. forge-desktop/test is
# the one gate directory enumerated by hand, so it is the one directory checked.
#
# A SEPARATE FILE, not a job added to kernel-tests.yml, for two reasons: it
# shares no dependency, runner or cache with anything there, and a new file
# cannot conflict with the several branches editing that workflow concurrently.
#
# COST. MEASURED locally over three runs: the check 0.22 s, its self-test 1.44 s.
# On a GitHub ubuntu runner the billable cost is dominated by job setup and
# checkout, ~15-25 s wall, at the 1x ubuntu multiplier — roughly a third of one
# runner-minute per pull request, against the macOS `desktop` job's ~5 minutes at
# 10x. An unaffordable gate gets disabled, so this one was kept to text
# processing: bash, grep, sed, awk, sort, comm. No compiler, no SDK, no network.

on:
  push:
    branches: [main, main-production, archdisc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate_registration:
    name: every forge-desktop gate is executed, not merely built
    runs-on: ubuntu-latest
    # Against a measured 1.7 s of actual work. The ceiling is here to kill a
    # hang, not to express a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Prove the registration check itself can fail (10 cases, ~1.6 s)
        # FIRST, before the check whose result we intend to believe. This drives
        # gate_registration_check.sh's nine documented red paths against stub
        # trees in a temp directory -- an orphaned target, a phantom target, an
        # add_executable naming a variable, a run_gate hidden inside a
        # conditional, an unaccounted gate source, a missing ad-hoc runner, an
        # AD_HOC list gone stale, an ad-hoc runner named only in a YAML comment,
        # and an absent run_desktop.sh -- plus one GREEN control, without which
        # this suite would pass just as well against a check that always exits 1.
        run: bash forge-desktop/test/gate_registration_selftest.sh

      - name: Every gate CMake builds is a gate run_desktop.sh runs
        run: bash forge-desktop/test/gate_registration_check.sh

      # ── FreeCAD-DERIVED LIBRARIES CARRY THEIR LGPL-2.1 OBLIGATIONS ──────────
      # Forge adapts FreeCAD code under third_party/freecad-derived/, each piece a
      # SEPARATE SHARED LIBRARY the app loads from Contents/Frameworks. These two
      # steps are hermetic (bash + python3, no build) and run in seconds: the
      # selftest first injects 18 compliance defects -- a missing licence text, an
      # undated modification record, an OCCT / Qt / Python include, a STATIC
      # library, an LGPL source compiled into the app, a packager that forgets the
      # notices -- and requires each to turn the gate red; then the gate runs on
      # the tree.
      - name: Prove the FreeCAD-derived LGPL gate can fail (18 defects + control)
        run: bash tools/gates/freecad_derived_lgpl_selftest.sh
      - name: FreeCAD-derived libraries are shared, dynamically linked and carry their LGPL notices
        run: bash tools/gates/freecad_derived_lgpl_gate.sh

      # ── EVERY ACTION IS PINNED TO A COMMIT, EVERY CHECKOUT DROPS ITS TOKEN ──
      # A `uses: actions/checkout@v4` resolves through a MUTABLE tag: whoever can
      # move that tag chooses the code that runs here, with the repository
      # checked out and a credential left in .git/config for every child process
      # to read -- including a 40-minute CMake build of third-party code
      # (CWE-829). Before this, 24 of the 26 references in this repository were
      # mutable tags and 2 of 18 checkouts dropped their credential.
      #
      # Selftest first, as everywhere else in this job: seven injected defects --
      # a tag, a commit with no version comment, an abbreviated commit, a
      # checkout that keeps its credential, persist-credentials declared TRUE, a
      # LIVE true beside a COMMENTED false, and a third-party action on a branch
      # -- plus a green control on the real workflows. Both steps are bash +
      # grep against a temp copy, no build.
      - name: Prove the action-pinning gate can fail (7 defects + control)
        run: bash tools/gates/actions_pinned_selftest.sh
      - name: Every action is pinned to a commit and every checkout drops its credential
        run: bash tools/gates/actions_pinned_gate.sh

      # ── THE COMPOSITION CENSUS CHECKS ITS OWN LEXER ─────────────────────────
      # tools/kernel/native_engine_composition.py decides, per Native* engine,
      # whether OCCT PRODUCES the answer or merely carries it -- and the report
      # built on it (forge-kernel/reports/NATIVE_ENGINE_COMPOSITION.md) is only
      # worth as much as its comment/string/include stripping. Four of the twelve
      # review findings against that tool were the stripper: a `//` containing
      # `/*` opened a phantom block comment that deleted code, an `#include`
      # counted as a use, the include step shifted every later offset, and the
      # offset check said "byte" while measuring characters.
      #
      # --selftest carries those five properties as fixtures. It is python3 only,
      # runs in milliseconds, and is here because a self-test nobody executes is
      # the same as no self-test.
      - name: The Native* composition census can still read C++ (5 lexical properties)
        run: python3 tools/kernel/native_engine_composition.py --selftest

  kernel_gate_registration:
    name: every forge-kernel gate is executed, not merely built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # Prove the ratchet can fail BEFORE trusting the run below. A registration
      # check that cannot go red is decoration. Seven cases, no build, ~35 s.
      #
      # ── WHY SEVEN AND NOT THREE (T-137 defect C). ────────────────────────────
      # The three original cases all exercise the SHELL enumeration, and all three
      # passed for as long as the ratchet has existed — while the ratchet was blind
      # to every gate written in C++ and to every gate CMake registers with
      # add_test(). heal_destruction_refusal_gate was committed, compiled, CMake-
      # registered, green on every check, and had executed zero times; this suite
      # said nothing, because nothing in it asked. Cases 4-6 ask.
      #
      # ★ CASE 7 IS THE SHARP ONE and it is a CONTROL, not a failure case. The old
      #   search asked "does ANY file name this gate?", which is a one-hop answer to
      #   a transitive question: a gate invoked only by a second script that nothing
      #   invokes read as WIRED. Case 7 builds exactly that — an orphan caller — and
      #   requires the ratchet to stay GREEN. Run it against the one-hop version and
      #   it goes red-on-an-improvement over a gate that still runs nowhere.
      - name: Prove the kernel registration ratchet can fail (7 cases)
        shell: bash
        run: |
          # ★ set +e IS LOAD-BEARING. GitHub's `shell: bash` runs
          #   `bash --noprofile --norc -eo pipefail`, so -e is ALREADY ON and a
          #   plain `set -uo pipefail` does NOT remove it. Every case below runs a
          #   command that is SUPPOSED to fail, and `OUT=$(...)` takes that exit
          #   status -- so under -e the step died the instant mutation 1 worked
          #   CORRECTLY, printing the baseline and then nothing at all. The proof
          #   succeeding is what killed the job.
          set +e
          set -uo pipefail
          R=forge-kernel/test/gate_registration_ratchet.sh
          fails=0

          # ── BASELINE FIRST, PRINTED UNCONDITIONALLY ────────────────────────
          # The previous revision only echoed the ratchet's output on FAILURE,
          # and the fetched job log came back truncated, so a red step told me
          # nothing at all about WHY. Print the baseline every time: if measured
          # and pinned disagree here, every case below is meaningless and this
          # line says so immediately.
          echo "--- baseline (before any mutation) ---"
          BASE=$(bash "$R" 2>&1); brc=$?
          echo "$BASE" | sed 's/^/    /'
          echo "    baseline exit=$brc  (0 expected: measured must equal pinned)"
          if [ $brc -ne 0 ]; then
            echo "::error::the ratchet is not GREEN on an unmodified tree — the proof cases below cannot mean anything"
            exit 1
          fi

          # 1. A NEW unwired gate must be caught. This is the case nothing in the
          #    repository caught before: adding a gate and forgetting to wire it.
          printf '#!/usr/bin/env bash\necho phantom\n' > forge-kernel/test/run_phantom_ci_gate.sh
          OUT=$(bash "$R" 2>&1); rc=$?
          rm -f forge-kernel/test/run_phantom_ci_gate.sh
          if [ $rc -eq 0 ]; then
            echo "::error::mutation 1 stayed GREEN — the ratchet does not detect a new unwired gate"
            echo "$OUT"; fails=$((fails+1))
          else echo "  mutation 1 (new unwired gate) caught"; fi
          echo "$OUT" | grep -E "measured=|RED|GREEN" | sed 's/^/      m1: /' || true

          # 2. An allowlisted gate becoming REACHABLE must also be red — a ratchet
          #    that cannot notice progress is not evidence.
          cp .github/workflows/kernel-tests.yml /tmp/kt.bak
          # A REAL invocation, not a comment. This case used to append
          #   `# run_pipe_drop_gate`
          # and rely on the ratchet counting that comment as an invocation -- the
          # very defect the ratchet now fixes. So the case was proving the bug:
          # once a comment stopped counting, the gate correctly stayed unreachable,
          # the ratchet correctly stayed GREEN, and this case reported the ratchet
          # "cannot notice an improvement". It can; the mutation was wrong.
          printf '\n      - name: proof m2\n        run: bash forge-kernel/test/run_pipe_drop_gate.sh\n' \
            >> .github/workflows/kernel-tests.yml
          OUT=$(bash "$R" 2>&1); rc=$?
          cp /tmp/kt.bak .github/workflows/kernel-tests.yml
          if [ $rc -eq 0 ]; then
            echo "::error::mutation 2 stayed GREEN — the ratchet cannot notice an improvement"
            echo "$OUT"; fails=$((fails+1))
          else echo "  mutation 2 (allowlisted gate became reachable) caught"; fi
          echo "$OUT" | grep -E "measured=|RED|GREEN" | sed 's/^/      m2: /' || true

          # 3. TRUE CONTROL: an edit naming NO gate must leave the verdict alone.
          #    Without this, cases 1-2 would pass over a check that simply reacts
          #    to any edit. (My first attempt at case 2 was not a control at all:
          #    the comment I inserted contained the gate name.)
          cp .github/workflows/kernel-tests.yml /tmp/kt.bak
          printf '\n# an unrelated comment naming nothing\n' >> .github/workflows/kernel-tests.yml
          OUT=$(bash "$R" 2>&1); rc=$?
          cp /tmp/kt.bak .github/workflows/kernel-tests.yml
          if [ $rc -ne 0 ]; then
            echo "::error::control FAILED — the ratchet reacts to any edit, not to gate reachability"
            echo "$OUT"; fails=$((fails+1))
          else echo "  control (unrelated edit) correctly unchanged"; fi

          # 4. A NEW unwired gate written in C++. THE ENUMERATION THAT DID NOT
          #    EXIST. forge-kernel/test holds eighteen *_gate.cpp files and the
          #    ratchet globbed only *_gate.sh, so this whole class was invisible to
          #    the one check built to see it.
          printf 'int main(){return 0;}\n' > forge-kernel/test/phantom_ci_gate.cpp
          OUT=$(bash "$R" 2>&1); rc=$?
          rm -f forge-kernel/test/phantom_ci_gate.cpp
          if [ $rc -eq 0 ]; then
            echo "::error::mutation 4 stayed GREEN — a .cpp gate is still invisible to the ratchet"
            echo "$OUT"; fails=$((fails+1))
          else echo "  mutation 4 (new unwired C++ gate) caught"; fi

          # 5. A NEW CMake-REGISTERED target nothing runs. add_test() puts a gate in
          #    a diff and in `ctest -N`, and ctest is invoked by no workflow, no
          #    script and no npm target here — three grep hits, all comments. So
          #    registration looks like wiring and is not. MEASURED when this case
          #    was written: 38 of 47 FORGE_AB_GATES entries reach no CI job.
          cp forge-kernel/CMakeLists.txt /tmp/cm.bak
          perl -0777 -pi -e 's/(    set\(FORGE_AB_GATES\n)/$1        phantom_registered_gate\n/' \
            forge-kernel/CMakeLists.txt
          OUT=$(bash "$R" 2>&1); rc=$?
          cp /tmp/cm.bak forge-kernel/CMakeLists.txt
          if [ $rc -eq 0 ]; then
            echo "::error::mutation 5 stayed GREEN — add_test() registration is checked by nothing"
            echo "$OUT"; fails=$((fails+1))
          else echo "  mutation 5 (new CMake-registered, unrun gate) caught"; fi

          # 6. An allowlisted C++ gate becoming REACHABLE. The improvement direction
          #    for the new enumeration, so it cannot silently stop noticing progress.
          cp .github/workflows/kernel-tests.yml /tmp/kt.bak
          printf '\n      - name: proof m6\n        run: ./build/forge_gate_sarc_ring_gate\n' \
            >> .github/workflows/kernel-tests.yml
          OUT=$(bash "$R" 2>&1); rc=$?
          cp /tmp/kt.bak .github/workflows/kernel-tests.yml
          if [ $rc -eq 0 ]; then
            echo "::error::mutation 6 stayed GREEN — the C++ enumeration cannot notice an improvement"
            echo "$OUT"; fails=$((fails+1))
          else echo "  mutation 6 (allowlisted C++ gate became reachable) caught"; fi

          # 7. CONTROL — THE TRANSITIVITY ONE. An ORPHAN CALLER: a script that
          #    invokes an allowlisted gate for real, and that nothing invokes in
          #    turn. The gate still runs nowhere, so the ratchet must stay GREEN.
          #    The one-hop search this replaced went red-on-an-improvement here,
          #    which would have had someone delete a correct ALLOW entry.
          #    (printf, not a heredoc: this whole block is a YAML block scalar, so a
          #     heredoc terminator cannot sit at column 0 and would never close.)
          printf '#!/usr/bin/env bash\nbash forge-kernel/test/run_pipe_drop_gate.sh\n' \
            > forge-kernel/test/orphan_caller_probe.sh
          OUT=$(bash "$R" 2>&1); rc=$?
          rm -f forge-kernel/test/orphan_caller_probe.sh
          if [ $rc -ne 0 ]; then
            echo "::error::control 7 FAILED — an orphan caller was counted as CI wiring"
            echo "$OUT"; fails=$((fails+1))
          else echo "  control 7 (orphan caller is not wiring) correctly GREEN"; fi

          [ $fails -eq 0 ] || { echo "::error::$fails of 7 proof cases failed"; exit 1; }
          echo "  all 7 proof cases pass — the ratchet is falsifiable"

      - name: Every gate named *_gate is reachable from CI (or pinned with a reason)
        shell: bash
        run: bash forge-kernel/test/gate_registration_ratchet.sh

      - name: Prove the tree-wide shell-gate ratchet can fail (7 cases)
        # FIRST, as with the two checks above. The ratchet beside it reports
        # GREEN, and a GREEN from a check that cannot fail is worth nothing --
        # this repository has already shipped one that passed 13/13 because it
        # enumerated by prefix and read its own comments as invocations.
        #
        # Case 4 is the sharp one: delete the ratchet's self-exclusion and
        # measured falls 5 -> 0, because every pinned gate finds its own name in
        # the ALLOW list that pins it and reports itself wired.
        shell: bash
        run: bash tools/gates/shell_gate_registration_selftest.sh

      - name: the OCCT removal tracker still matches the code
        # The removal directive requires this document be "synchronized with actual
        # code". A hand-kept tracker is synchronized only until the first person
        # forgets, and a removal programme steered by a stale map is worse than one
        # with no map -- it reports progress that has not happened. So the tracker is
        # GENERATED from the tree and this step fails if the committed copy has
        # drifted, in either direction: a hand edit to the document, or a new OCCT
        # include in code the document says is clean.
        shell: bash
        run: python3 tools/kernel/occt_dependency_graph.py --check

      - name: and a COMPILER agrees with the tracker about the header surface
        # THE STEP ABOVE CHECKS A TEXT MEASURE AGAINST ITSELF. It regenerates the
        # document from the same include-line walk that wrote it, so it catches a
        # hand edit and a new include, and it cannot catch the walk being wrong
        # about what a compiler does. It was: forge/BodyInventory.hpp named no OCCT
        # type, reached it through forge/ShapeRegistry.hpp, and was the ENTIRE OCCT
        # dependency of forge-desktop/src/KernelScene.cpp while appearing in no list
        # the document prints. In the other direction the walk charged
        # forge/ArcHelix.hpp for an OCCT include no build compiles -- its body is
        # behind #ifdef FORGE_FT_ARCHELIX.
        #
        # So this compiles every public kernel header as a one-line translation unit
        # with NO OCCT on the include path and requires the failing set to equal
        # exactly what the walk claims. --selftest first, because a control nobody
        # has seen fail is a control nobody has read: it perturbs the CLAIM in both
        # directions (drop a real entry, add a phantom) and requires red each way.
        #
        # --report-shipped adds the -DFORGE_NATIVE_BREP=1 arm. It changes no verdict
        # and is here for the number: bare is 14 and the SHIPPED build is 31, which
        # is what the application actually faces and is neither figure the document
        # prints. Seventeen Native* headers reach OCCT only once that option is on,
        # and CMake defaults it ON.
        shell: bash
        #
        # ★ THIS STEP TOOK CI RED ON THE COMMIT THAT ADDED IT, and the fix is why
        #   it now asks -M instead of asking whether a compile failed. The first
        #   version counted headers that would not COMPILE with no OCCT directory
        #   on the include path. That is a property of the MACHINE: this runner
        #   installs OCCT into the system include path, so <TopoDS_Shape.hxx>
        #   resolved with no -I and the step read 0 where a workstation read 14 --
        #   then failed claiming fourteen phantom entries. `-M -MG` lists what the
        #   preprocessor actually opened, which is the real question and gives the
        #   same answer with or without the SDK installed. The --occt-inc control
        #   pins that equality; here it is redundant because OCCT is already
        #   present, which is exactly the configuration that broke it.
        run: |
          python3 tools/kernel/occt_header_reach_check.py --selftest
          python3 tools/kernel/occt_header_reach_check.py --report-shipped

      - name: Vec3 stays ONE type, and the module epsilon guards stay put
        # Vec3 had TEN layout-identical declarations in ten namespaces, and the
        # canonical forge/math/Vec3.hpp existed while being included by no file under
        # native/ at all. They are now one type reached by alias. Two regressions are
        # possible from here and NEITHER would fail any test: a new module re-declares
        # its own struct Vec3, or someone "unifies" the modules' free normalize onto
        # the canonical member -- whose zero-length epsilon is 1e-15 against materials'
        # DBL_MIN and composites' 1e-300, so a length-1e-20 vector flips from {1,0,0}
        # to {0,0,0} across nine subsystems, silently. This fails on both, and its
        # --selftest proves each check actually goes red.
        shell: bash
        run: |
          python3 tools/kernel/vec3_unification_gate.py
          python3 tools/kernel/vec3_unification_gate.py --selftest

      - name: The native B-Rep scope note still matches the code
        # forge/native/brep/Topology.hpp carries the honesty block that anyone
        # planning OCCT-removal work reads FIRST, so it is read as scope. It went
        # stale silently: it said "No geometry is attached to the topology yet"
        # while Edge::curve and Face::surface were both present and used across 30
        # files, and "No booleans / sewing / healing / feature ops" while
        # Boolean.hpp declared booleanSolid(const Solid&, const Solid&, BoolOp)
        # against those very types. Under-claiming is the dangerous direction: a
        # planning tick reads it and schedules work that is already finished. Every
        # claim is now probed against the code, and --selftest proves each probe flips.
        shell: bash
        run: |
          python3 tools/kernel/topology_honesty_gate.py
          python3 tools/kernel/topology_honesty_gate.py --selftest

      - name: Every gate written in JavaScript reaches CI
        # The hole between three correctly-scoped checks. gate_registration_ratchet.sh
        # covers *_gate.sh under forge-kernel/test, shell_gate_registration_ratchet.sh
        # covers tree-wide *.sh, gate_registration_check.sh covers forge-desktop --
        # all green, and NOT ONE can see a gate written in JavaScript. Eleven files
        # match *_gate.{js,mjs}; TEN had never run, including cfd_sod_gate (native 1D
        # Euler vs the EXACT Sod Riemann solution) and setback_clearance_gate, whose
        # own --selftest drives six mutations and requires every one to turn it red.
        shell: bash
        run: |
          python3 tools/kernel/js_gate_registration_gate.py
          python3 tools/kernel/js_gate_registration_gate.py --selftest

      - name: Every *_gate.sh anywhere is reachable from CI (or pinned)
        # The gap between the two checks above. They are each correctly scoped and
        # neither can see a *_gate.sh outside forge-kernel/test, nor one inside it
        # named neither run_* nor build_*. THREE gates had never executed once:
        # the guardian single-instance gate (33 checks, 11 mutations), the Archie
        # remote-planner gate (32 checks), and update_apply_refuses_gate.sh -- a
        # SECURITY gate asserting that the shipped updater refuses an update it
        # cannot attribute. All three are wired now; this is what keeps them so.
        shell: bash
        run: bash tools/gates/shell_gate_registration_ratchet.sh

      # The release job's published-release lookup masked a 404 into a 130-byte
      # error body and failed 11 of its last 14 runs. The build was never broken:
      # 13 of 14 steps passed every time, including the kernel gate. This runs the
      # lookup's own gate against the SHIPPED desktop-release.yml, with a stub `gh`
      # reproducing the measured 404 behaviour (exit 1, body on STDOUT, message on
      # STDERR), so the same masking cannot come back unnoticed.
      - name: The release job's published-release lookup survives a 404
        shell: bash
        run: bash .github/workflows/test/test_release_prev_lookup.sh

      # A repo variable reaches a step ONLY through an `env:` mapping. A shell
      # reading ${FORGE_X:-} with no mapping reads the empty string and `:-`
      # supplies a plausible default, so an owner-controlled switch becomes a
      # valve nobody can open -- which is exactly what shipped in the release
      # job's first-release gate. This asserts every FORGE_* a run block reads
      # is actually mapped in.
      - name: Every FORGE_* a run block reads is mapped into the shell
        shell: bash
        run: python3 .github/workflows/test/test_env_is_mapped.py
