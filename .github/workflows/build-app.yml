name: Build ArchDisc Desktop App
on:
  push:
    branches: [archdisc]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm install
      - run: cd frontend && npx vite build
      - run: npm install -D electron electron-builder
      - run: npx electron-builder --win --x64 --config.win.icon=null --config.nsis.installerIcon=null --config.nsis.uninstallerIcon=null --config.nsis.installerHeaderIcon=null
      - uses: actions/upload-artifact@v4
        with:
          name: ArchDisc-Setup
          path: dist-electron/ArchDisc-Setup-*.exe
